name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  build:
    name: Build y Verificar
    runs-on: ubuntu-latest
    env:
      MERCADO_PAGO_ENVIRONMENT: sandbox

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen de desarrollo
        run: docker compose build api-dev

      - name: Crear archivo .env de prueba
        run: cp .env.example .env

      - name: Iniciar dependencias de prueba
        run: |
          docker compose up -d --wait test-db minio
          docker compose run --rm --no-deps minio-init

      - name: Ejecutar pruebas
        run: make test-ci

      - name: Ejecutar linter
        run: make lint-ci
