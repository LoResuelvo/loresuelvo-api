name: Deploy Production

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH a Producción
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_PROD_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/loresuelvo-api
            git fetch --tags --force
            git checkout ${{ github.ref_name }}

            cat config/prod.conf > .env
            cat >> .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            STORAGE_ACCESS_KEY_ID=${{ secrets.STORAGE_ACCESS_KEY_ID }}
            STORAGE_SECRET_ACCESS_KEY=${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
            CHATBOT_API_KEY=${{ secrets.CHATBOT_API_KEY }}
            MERCADO_PAGO_CLIENT_ID=${{ secrets.MERCADO_PAGO_CLIENT_ID }}
            MERCADO_PAGO_CLIENT_SECRET=${{ secrets.MERCADO_PAGO_CLIENT_SECRET }}
            PAYMENT_ACCOUNT_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.PAYMENT_ACCOUNT_CREDENTIAL_ENCRYPTION_KEY }}
            MERCADO_PAGO_WEBHOOK_SECRET=${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
            EOF
            chmod 600 .env
            if grep -E '^[A-Z_]+=$' .env; then
              echo "ERROR: empty values found in .env" >&2
              exit 1
            fi

            export IMAGE_TAG=${{ github.ref_name }}
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml --profile tools run --rm seed-assets
            docker compose -f compose.prod.yml run --rm migrate
            docker compose -f compose.prod.yml up -d
            docker compose -f compose.prod.yml exec -T nginx nginx -t
            docker compose -f compose.prod.yml exec -T nginx nginx -s reload
            docker image prune -f
