name: Release & Deploy

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push de la imagen
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LC}/api:${{ github.ref_name }}"

          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH a Staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_STAGING_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/loresuelvo-api
            git fetch --tags --force
            git checkout ${{ github.ref_name }}

            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}
            AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN_STAGING }}
            AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE_STAGING }}
            ENVIRONMENT=staging
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS_STAGING }}
            STORAGE_PROVIDER=${{ secrets.STORAGE_PROVIDER }}
            STORAGE_ENDPOINT=${{ secrets.STORAGE_ENDPOINT }}
            STORAGE_REGION=${{ secrets.STORAGE_REGION }}
            STORAGE_ACCESS_KEY_ID=${{ secrets.STORAGE_ACCESS_KEY_ID_STAGING }}
            STORAGE_SECRET_ACCESS_KEY=${{ secrets.STORAGE_SECRET_ACCESS_KEY_STAGING }}
            STORAGE_PUBLIC_BUCKET=${{ secrets.STORAGE_PUBLIC_BUCKET_STAGING }}
            STORAGE_PRIVATE_BUCKET=${{ secrets.STORAGE_PRIVATE_BUCKET_STAGING }}
            STORAGE_PUBLIC_BASE_URL=${{ secrets.STORAGE_PUBLIC_BASE_URL_STAGING }}
            STORAGE_PRESIGN_EXPIRATION_SECONDS=${{ secrets.STORAGE_PRESIGN_EXPIRATION_SECONDS }}
            CHATBOT_PROVIDER=${{ secrets.CHATBOT_PROVIDER }}
            CHATBOT_API_KEY=${{ secrets.CHATBOT_API_KEY_STAGING }}
            SEEDS_ENABLED=${{ secrets.SEEDS_ENABLED }}
            SEEDS_FILE=seeds/providers-100.yaml
            EOF
            chmod 600 .env
            if grep -E '^[A-Z_]+=$' .env; then
              echo "ERROR: empty values found in .env" >&2
              exit 1
            fi

            export IMAGE_TAG=${{ github.ref_name }}
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml --profile tools run --rm seed-assets
            docker compose -f compose.prod.yml run --rm migrate
            docker compose -f compose.prod.yml up -d
            docker compose -f compose.prod.yml exec -T nginx nginx -t
            docker compose -f compose.prod.yml exec -T nginx nginx -s reload
            docker image prune -f

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH a Producción
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_PROD_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/loresuelvo-api
            git fetch --tags --force
            git checkout ${{ github.ref_name }}

            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}
            AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN_PROD }}
            AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE_PROD }}
            ENVIRONMENT=production
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS_PROD }}
            STORAGE_PROVIDER=${{ secrets.STORAGE_PROVIDER }}
            STORAGE_ENDPOINT=${{ secrets.STORAGE_ENDPOINT }}
            STORAGE_REGION=${{ secrets.STORAGE_REGION }}
            STORAGE_ACCESS_KEY_ID=${{ secrets.STORAGE_ACCESS_KEY_ID_PROD }}
            STORAGE_SECRET_ACCESS_KEY=${{ secrets.STORAGE_SECRET_ACCESS_KEY_PROD }}
            STORAGE_PUBLIC_BUCKET=${{ secrets.STORAGE_PUBLIC_BUCKET_PROD }}
            STORAGE_PRIVATE_BUCKET=${{ secrets.STORAGE_PRIVATE_BUCKET_PROD }}
            STORAGE_PUBLIC_BASE_URL=${{ secrets.STORAGE_PUBLIC_BASE_URL_PROD }}
            STORAGE_PRESIGN_EXPIRATION_SECONDS=${{ secrets.STORAGE_PRESIGN_EXPIRATION_SECONDS }}
            CHATBOT_PROVIDER=${{ secrets.CHATBOT_PROVIDER }}
            CHATBOT_API_KEY=${{ secrets.CHATBOT_API_KEY_PROD }}
            SEEDS_ENABLED=${{ secrets.SEEDS_ENABLED }}
            SEEDS_FILE=seeds/providers-100.yaml
            EOF
            chmod 600 .env
            if grep -E '^[A-Z_]+=$' .env; then
              echo "ERROR: empty values found in .env" >&2
              exit 1
            fi

            export IMAGE_TAG=${{ github.ref_name }}
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml --profile tools run --rm seed-assets
            docker compose -f compose.prod.yml run --rm migrate
            docker compose -f compose.prod.yml up -d
            docker compose -f compose.prod.yml exec -T nginx nginx -t
            docker compose -f compose.prod.yml exec -T nginx nginx -s reload
            docker image prune -f
