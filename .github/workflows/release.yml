name: Release & Deploy

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  run-test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-push:
    needs: run-test
    uses: ./.github/workflows/packaging.yml
    secrets: inherit

  deploy-staging:
    needs: build-and-push
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  deploy-prod:
    needs: deploy-staging
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
