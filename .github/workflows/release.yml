name: Release & Deploy

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push de la imagen
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/api:latest .
          docker push ghcr.io/${{ github.repository_owner }}/api:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH a Staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_STAGING_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app/api
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # Pauses deployment until manual approval
    steps:
      - name: Deploy via SSH a Producción
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_PROD_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app/api
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d