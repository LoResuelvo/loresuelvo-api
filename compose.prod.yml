services:
  api:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    env_file:
      - /etc/loresuelvo/api/api.env
    restart: unless-stopped
    networks:
      - app-network

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /docs
      URL: /openapi.json
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    image: migrate/migrate
    profiles:
      - tools
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    networks:
      - app-network

  seed-assets:
    # One-shot S3-compatible client used to upload seed profile photos to the
    # real bucket configured through STORAGE_*; it does not run local storage.
    image: public.ecr.aws/aws-cli/aws-cli:latest
    profiles:
      - tools
    env_file:
      - /etc/loresuelvo/api/api.env
    working_dir: /work
    volumes:
      - ./seeds:/work/seeds:ro
      - ./scripts/upload_seed_assets.sh:/work/scripts/upload_seed_assets.sh:ro
    environment:
      SEED_ASSETS_DIR: /work/seeds/assets
      SEED_ASSET_MANIFEST: /work/seeds/providers-100-assets.tsv
    entrypoint: ["/bin/sh", "/work/scripts/upload_seed_assets.sh"]
    networks:
      - app-network

  seed-db:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    profiles:
      - tools
    env_file:
      - /etc/loresuelvo/api/api.env
    environment:
      SEEDS_ENABLED: "true"
    command: ["./seed-db"]
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./openapi.json:/etc/nginx/openapi/openapi.json:ro
      - /etc/loresuelvo/api/tls/origin.crt:/etc/nginx/tls/origin.crt:ro
      - /etc/loresuelvo/api/tls/origin.key:/etc/nginx/tls/origin.key:ro
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true
