services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /docs
      URL: /openapi.json
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    image: migrate/migrate
    profiles:
      - tools
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    networks:
      - app-network

  seed-assets:
    image: amazon/aws-cli:2
    profiles:
      - tools
    env_file:
      - .env
    working_dir: /work
    volumes:
      - ./seeds:/work/seeds:ro
      - ./scripts/upload_seed_assets.sh:/work/scripts/upload_seed_assets.sh:ro
    environment:
      SEED_ASSETS_DIR: /work/seeds/assets
      SEED_ASSET_MANIFEST: /work/seeds/providers-100-assets.tsv
    entrypoint: ["/bin/sh", "/work/scripts/upload_seed_assets.sh"]
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./openapi.json:/etc/nginx/openapi/openapi.json:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  app-network:
    name: app-network
    driver: bridge
