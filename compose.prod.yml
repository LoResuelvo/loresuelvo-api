services:
  api:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    env_file:
      - /etc/loresuelvo/api/api.env
    restart: unless-stopped
    networks:
      - app-network

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /docs
      URL: /openapi.json
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    profiles:
      - tools
    env_file:
      - /etc/loresuelvo/api/api.env
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./openapi.json:/etc/nginx/openapi/openapi.json:ro
      - /etc/loresuelvo/api/tls/origin.crt:/etc/nginx/tls/origin.crt:ro
      - /etc/loresuelvo/api/tls/origin.key:/etc/nginx/tls/origin.key:ro
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true
