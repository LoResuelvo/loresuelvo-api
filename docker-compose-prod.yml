services:
  api:
    image: ghcr.io/LoResuelvo/loresuelvo-api:latest
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge
