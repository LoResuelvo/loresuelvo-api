services:
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    environment:
      DATABASE_URL: "postgres://postgres:example@dev-db:5432/loresuelvo?sslmode=disable"
      TEST_DATABASE_URL: "postgres://postgres:example@test-db:5432/loresuelvo_test?sslmode=disable"
      ENVIRONMENT: "${ENVIRONMENT:-dev}"
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:3000"
      SEEDS_ENABLED: "${SEEDS_ENABLED:-false}"
      SEEDS_FILE: "${SEEDS_FILE:-seeds/default.yaml}"
      MINIO_API_PORT: "${MINIO_API_PORT:-9000}"
      MINIO_CONSOLE_PORT: "${MINIO_CONSOLE_PORT:-9001}"
      STORAGE_PROVIDER: "s3"
      STORAGE_ENDPOINT: "http://minio.localhost:${MINIO_API_PORT:-9000}"
      STORAGE_REGION: "us-east-1"
      STORAGE_PUBLIC_BUCKET: "loresuelvo-public-local"
      STORAGE_PRIVATE_BUCKET: "loresuelvo-private-local"
      STORAGE_PUBLIC_BASE_URL: "http://minio.localhost:${MINIO_API_PORT:-9000}/loresuelvo-public-local"
      TEST_STORAGE_PUBLIC_BUCKET: "loresuelvo-public-test"
      TEST_STORAGE_PRIVATE_BUCKET: "loresuelvo-private-test"
      TEST_STORAGE_PUBLIC_BASE_URL: "http://minio.localhost:${MINIO_API_PORT:-9000}/loresuelvo-public-test"
      STORAGE_ACCESS_KEY_ID: "loresuelvo-local"
      STORAGE_SECRET_ACCESS_KEY: "loresuelvo-local-secret"
      STORAGE_PRESIGN_EXPIRATION_SECONDS: "600"
    env_file:
      - .env
    depends_on:
      dev-db:
        condition: service_healthy
      test-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - api.localhost

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.json
    volumes:
      - ./openapi.json:/spec/openapi.json:ro

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --address ":${MINIO_API_PORT:-9000}" --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: "loresuelvo-local"
      MINIO_ROOT_PASSWORD: "loresuelvo-local-secret"
      MINIO_REGION_NAME: "us-east-1"
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081"
      MINIO_BROWSER_REDIRECT_URL: "http://minio.localhost:${MINIO_CONSOLE_PORT:-9001}"
    ports:
      - "${MINIO_API_PORT:-9000}:${MINIO_API_PORT:-9000}"
      - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${MINIO_API_PORT:-9000}/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      default:
        aliases:
          - minio.localhost

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "loresuelvo-local"
      MINIO_ROOT_PASSWORD: "loresuelvo-local-secret"
      MINIO_API_PORT: "${MINIO_API_PORT:-9000}"
      STORAGE_PUBLIC_BUCKET: "loresuelvo-public-local"
      STORAGE_PRIVATE_BUCKET: "loresuelvo-private-local"
      TEST_STORAGE_PUBLIC_BUCKET: "loresuelvo-public-test"
      TEST_STORAGE_PRIVATE_BUCKET: "loresuelvo-private-test"
    volumes:
      - ./scripts/minio:/minio-init:ro
      - ./seeds/assets:/seed-assets:ro
      - ./seeds:/seed-manifest:ro
    entrypoint: ["/bin/sh", "/minio-init/init.sh"]
    networks:
      default:
        aliases:
          - minio-init.localhost

  minio-clean-tests:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: "loresuelvo-local"
      MINIO_ROOT_PASSWORD: "loresuelvo-local-secret"
      MINIO_API_PORT: "${MINIO_API_PORT:-9000}"
      TEST_STORAGE_PUBLIC_BUCKET: "loresuelvo-public-test"
      TEST_STORAGE_PRIVATE_BUCKET: "loresuelvo-private-test"
    volumes:
      - ./scripts/minio:/minio-init:ro
    entrypoint: ["/bin/sh", "/minio-init/clean-test-buckets.sh"]
    profiles:
      - tools

  dev-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loresuelvo
      POSTGRES_PASSWORD: example
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loresuelvo"]
      interval: 2s
      timeout: 5s
      retries: 15

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loresuelvo_test
      POSTGRES_PASSWORD: example
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loresuelvo_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  go-build-cache:
  go-mod-cache:
  minio-data:
