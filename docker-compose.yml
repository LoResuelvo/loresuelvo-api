services:
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    environment:
      DATABASE_URL: "postgres://postgres:example@dev-db:5432/loresuelvo?sslmode=disable"
      TEST_DATABASE_URL: "postgres://postgres:example@test-db:5432/loresuelvo_test?sslmode=disable"
      CORS_ALLOWED_ORIGINS: "http://localhost:8081"
    env_file:
      - .env
    depends_on:
      dev-db:
        condition: service_healthy
      test-db:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.json
    volumes:
      - ./openapi.json:/spec/openapi.json:ro

  dev-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loresuelvo
      POSTGRES_PASSWORD: example
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loresuelvo"]
      interval: 2s
      timeout: 5s
      retries: 15

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loresuelvo_test
      POSTGRES_PASSWORD: example
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loresuelvo_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  go-build-cache:
  go-mod-cache: