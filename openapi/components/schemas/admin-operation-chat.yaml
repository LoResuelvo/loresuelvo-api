type: object
additionalProperties: false
description: >-
  One audited chronological page of a persisted work conversation. Messages
  belong to the conversation, not exclusively to the selected proposal.
required:
- operation_id
- conversation_id
- job_request_id
- service_proposal_id
- related_service_proposal_ids
- shared_conversation
- messages
- next_cursor
properties:
  operation_id:
    type: string
    pattern: '^(jr|sp)-[1-9][0-9]*$'
    description: Stable operation identity; numeric suffix is 1 through 2147483647.
    example: sp-42
  conversation_id:
    type: integer
    minimum: 1
    description: Persisted work conversation associated with the selected operation.
  job_request_id:
    type: [integer, 'null']
    minimum: 1
    description: Associated request ID, or null for a proposal without a request.
  service_proposal_id:
    type: [integer, 'null']
    minimum: 1
    description: Selected proposal ID, or null when the request has no proposal.
  related_service_proposal_ids:
    type: array
    uniqueItems: true
    description: All persisted proposal IDs sharing this conversation, in ascending ID order; never null.
    items:
      type: integer
      minimum: 1
  shared_conversation:
    type: boolean
    description: True exactly when more than one persisted proposal shares this conversation.
  messages:
    type: array
    maxItems: 100
    description: >-
      Never null. Ordered by created_on ascending, then message ID ascending.
      Attachments are optional and restricted to this page's owned messages.
    items:
      $ref: '#/components/schemas/AdminOperationChat/$defs/Message'
  next_cursor:
    type: [string, 'null']
    maxLength: 4096
    description: Opaque signed continuation token, or null when no further message was found.
$defs:
  Message:
    type: object
    additionalProperties: false
    required: [id, sender_role, content, created_on]
    properties:
      id:
        type: integer
        minimum: 1
      sender_role:
        type: string
        enum: [consumer, provider]
      content:
        type: string
        description: Persisted message text; may be empty for a media-only message.
      created_on:
        type: string
        format: date-time
      images:
        type: array
        minItems: 1
        description: Omitted when no available owned image exists; never raw storage-key or bucket fields.
        items:
          $ref: '#/components/schemas/AdminOperationChat/$defs/Image'
      audio:
        $ref: '#/components/schemas/AdminOperationChat/$defs/Audio'
      video:
        $ref: '#/components/schemas/AdminOperationChat/$defs/Video'
  Image:
    type: object
    additionalProperties: false
    required: [id, url, original_name]
    properties:
      id:
        type: string
        format: uuid
      url:
        type: string
        format: uri
        description: Private signed download URL prepared only after the access audit is saved.
      original_name:
        type: string
      description:
        type: string
        description: Persisted image description; omitted when empty.
  Audio:
    type: object
    additionalProperties: false
    required: [id, url, original_name, mime_type, codec, duration_seconds]
    properties:
      id:
        type: string
        format: uuid
      url:
        type: string
        format: uri
        description: Private signed download URL prepared only after the access audit is saved.
      original_name:
        type: string
      mime_type:
        type: string
      codec:
        type: string
      duration_seconds:
        type: integer
        minimum: 1
  Video:
    type: object
    additionalProperties: false
    required: [id, url, original_name, mime_type, video_codec, duration_seconds, width, height]
    properties:
      id:
        type: string
        format: uuid
      url:
        type: string
        format: uri
        description: Private signed download URL prepared only after the access audit is saved.
      original_name:
        type: string
      mime_type:
        type: string
      video_codec:
        type: string
      audio_codec:
        type: string
        description: Omitted when no audio codec is recorded.
      duration_seconds:
        type: integer
        minimum: 1
      width:
        type: integer
        minimum: 1
      height:
        type: integer
        minimum: 1
