type: object
description: >-
  Persisted evidence for one stable administrative operation. Null means that
  the corresponding relation or recorded value is absent; empty arrays mean
  that no matching records exist. No chat content, storage URL, checkout URL,
  credential, or payment-provider payload is exposed.
required:
- id
- started_on
- job_request
- service_proposal
- related_proposals
- work_order
- payment_milestones
- timeline
- consumer
- provider
- category
- address
- source_assessment
properties:
  id:
    type: string
    pattern: '^(jr|sp)-[1-9][0-9]*$'
    description: Stable identity shared with the administrative operations inbox.
  started_on:
    type: string
    format: date-time
  job_request:
    oneOf:
    - $ref: '#/components/schemas/AdminOperationDetail/$defs/JobRequest'
    - type: 'null'
    description: Null for a proposal that has no linked job request.
  service_proposal:
    oneOf:
    - $ref: '#/components/schemas/AdminOperationDetail/$defs/Proposal'
    - type: 'null'
    description: Only the proposal belonging to this operation, if any.
  related_proposals:
    type: array
    description: >-
      Proposals in the same conversation, each with its own stable operation
      ID. These are context, not primary payment or timeline evidence.
    items:
      $ref: '#/components/schemas/AdminOperationDetail/$defs/RelatedProposal'
  work_order:
    oneOf:
    - $ref: '#/components/schemas/AdminOperationDetail/$defs/WorkOrder'
    - type: 'null'
    description: The selected proposal's work order, if one exists.
  payment_milestones:
    type: array
    description: >-
      Internal payment-intent references for the selected proposal only;
      statuses are payment-intent statuses, not transaction statuses.
    items:
      $ref: '#/components/schemas/AdminOperationDetail/$defs/PaymentMilestone'
  timeline:
    type: array
    description: >-
      Events backed by recorded timestamps for this operation, sorted by
      occurred_on, then type, then source_id. No inferred request acceptance
      timestamp or chat event is emitted.
    items:
      $ref: '#/components/schemas/AdminOperationDetail/$defs/TimelineEvent'
  consumer:
    $ref: '#/components/schemas/AdminOperationParty'
  provider:
    $ref: '#/components/schemas/AdminOperationParty'
  category:
    oneOf:
    - $ref: '#/components/schemas/AdminOperationDetail/$defs/Category'
    - type: 'null'
    description: Provider category, or null if unavailable.
  address:
    oneOf:
    - $ref: '#/components/schemas/AdminOperationDetail/$defs/Address'
    - type: 'null'
    description: Current consumer address, not a historical request snapshot.
  source_assessment:
    oneOf:
    - $ref: '#/components/schemas/AdminOperationDetail/$defs/SourceAssessment'
    - type: 'null'
    description: >-
      Assessment referenced by the request's persisted source_assessment_id;
      null when no such reference exists. Never inferred from the latest
      conversation assessment.
additionalProperties: false
$defs:
  Category:
    type: object
    required: [id, name]
    properties:
      id:
        type: integer
        minimum: 1
      name:
        type: string
    additionalProperties: false
  PrivateImage:
    type: object
    description: Confirmed private image metadata; bytes require the protected image endpoint.
    required: [file_id, original_name, mime_type, purpose, created_on]
    properties:
      file_id:
        type: string
        format: uuid
      original_name:
        type: string
      mime_type:
        type: string
        enum: [image/jpeg, image/png, image/webp]
      purpose:
        type: string
        enum: [job_request_image, work_order_completion_image]
      created_on:
        type: string
        format: date-time
    additionalProperties: false
  JobRequest:
    type: object
    required: [id, status, title, description, created_on, images]
    properties:
      id:
        type: integer
        minimum: 1
      status:
        type: string
        enum: [pending, accepted]
      title:
        type: string
      description:
        type: string
      created_on:
        type: string
        format: date-time
      images:
        type: array
        items:
          $ref: '#/components/schemas/AdminOperationDetail/$defs/PrivateImage'
    additionalProperties: false
  Proposal:
    type: object
    required: [id, status, description, amount_cents, currency, created_on, scheduled_on, estimated_duration_minutes, deposit_cents, platform_fee_total_cents, platform_fee_due_now_cents, service_balance_cents, platform_fee_balance_cents]
    properties:
      id:
        type: integer
        minimum: 1
      status:
        type: string
        enum: [pending, accepted, rejected]
      description:
        type: string
      amount_cents:
        type: integer
        format: int64
      currency:
        type: string
        enum: [ARS]
      created_on:
        type: string
        format: date-time
      scheduled_on:
        type: string
        format: date-time
      estimated_duration_minutes:
        type: integer
      deposit_cents:
        type: integer
        format: int64
      platform_fee_total_cents:
        type: integer
        format: int64
      platform_fee_due_now_cents:
        type: integer
        format: int64
      service_balance_cents:
        type: integer
        format: int64
      platform_fee_balance_cents:
        type: integer
        format: int64
    additionalProperties: false
  RelatedProposal:
    type: object
    required: [operation_id, id, status, description, amount_cents, currency, created_on, scheduled_on, estimated_duration_minutes, deposit_cents, platform_fee_total_cents, platform_fee_due_now_cents, service_balance_cents, platform_fee_balance_cents]
    properties:
      operation_id:
        type: string
        pattern: '^(jr|sp)-[1-9][0-9]*$'
      id:
        type: integer
        minimum: 1
      status:
        type: string
        enum: [pending, accepted, rejected]
      description:
        type: string
      amount_cents:
        type: integer
        format: int64
      currency:
        type: string
        enum: [ARS]
      created_on:
        type: string
        format: date-time
      scheduled_on:
        type: string
        format: date-time
      estimated_duration_minutes:
        type: integer
      deposit_cents:
        type: integer
        format: int64
      platform_fee_total_cents:
        type: integer
        format: int64
      platform_fee_due_now_cents:
        type: integer
        format: int64
      service_balance_cents:
        type: integer
        format: int64
      platform_fee_balance_cents:
        type: integer
        format: int64
    additionalProperties: false
  WorkOrder:
    type: object
    required: [id, status, accepted_on, completion_reported_on, balance_paid_on, completion_report, review]
    properties:
      id:
        type: integer
        minimum: 1
      status:
        type: string
        enum: [scheduled, awaiting_payment, paid]
      accepted_on:
        type: string
        format: date-time
      completion_reported_on:
        type: [string, 'null']
        format: date-time
      balance_paid_on:
        type: [string, 'null']
        format: date-time
      completion_report:
        oneOf:
        - $ref: '#/components/schemas/AdminOperationDetail/$defs/CompletionReport'
        - type: 'null'
      review:
        oneOf:
        - $ref: '#/components/schemas/AdminOperationDetail/$defs/Review'
        - type: 'null'
    additionalProperties: false
  CompletionReport:
    type: object
    required: [description, reported_on, images]
    properties:
      description:
        type: string
      reported_on:
        type: string
        format: date-time
      images:
        type: array
        items:
          $ref: '#/components/schemas/AdminOperationDetail/$defs/PrivateImage'
    additionalProperties: false
  Review:
    type: object
    description: >-
      No review timestamp is recorded by this resource. This ordinary operation
      detail retains a hidden review's rating but returns an empty description;
      it does not expose the hidden original available through the restricted
      administrative review detail endpoint.
    required: [rating, description]
    properties:
      rating:
        type: integer
        minimum: 1
        maximum: 5
      description:
        type: string
    additionalProperties: false
  PaymentMilestone:
    type: object
    required: [id, purpose, status, created_on]
    properties:
      id:
        type: string
        format: uuid
      purpose:
        type: string
        enum: [booking_deposit, service_balance]
      status:
        type: string
        enum: [requires_checkout, checkout_ready, processing, paid, expired, cancelled, refunded, disputed, payment_mismatch, rejected]
      created_on:
        type: string
        format: date-time
    additionalProperties: false
  TimelineEvent:
    type: object
    required: [type, source_type, source_id, occurred_on]
    properties:
      type:
        type: string
        enum: [job_request_created, service_proposal_created, work_order_accepted, completion_reported, balance_paid, payment_intent_created]
      source_type:
        type: string
        enum: [job_request, service_proposal, work_order, payment_intent]
      source_id:
        type: string
        description: Decimal resource ID or payment-intent UUID.
      occurred_on:
        type: string
        format: date-time
    additionalProperties: false
  Address:
    type: object
    required: [street, street_number, floor, unit, source]
    properties:
      street:
        type: string
      street_number:
        type: string
      floor:
        type: [string, 'null']
      unit:
        type: [string, 'null']
      source:
        type: string
        const: current_consumer_address
    additionalProperties: false
  SourceAssessment:
    type: object
    required: [id, version, outcome, category, title, description, based_on_message_id, created_on]
    properties:
      id:
        type: integer
        minimum: 1
      version:
        type: integer
        minimum: 1
      outcome:
        type: string
        enum: [collecting_information, self_service, professional_required]
      category:
        oneOf:
        - $ref: '#/components/schemas/AdminOperationDetail/$defs/Category'
        - type: 'null'
      title:
        type: string
      description:
        type: string
      based_on_message_id:
        type: integer
        minimum: 1
      created_on:
        type: string
        format: date-time
    additionalProperties: false
