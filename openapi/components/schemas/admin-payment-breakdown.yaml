type: object
required:
  - currency
  - service_total_cents
  - deposit_cents
  - platform_fee_total_cents
  - platform_fee_due_now_cents
  - booking_payment_deadline
  - amount_due_now_cents
  - remaining_service_balance_cents
  - remaining_platform_fee_cents
  - remaining_amount_due_cents
properties:
  currency:
    type: string
    description: Persisted contract currency.
  service_total_cents:
    type: integer
    format: int64
    minimum: 0
    description: Persisted total service price in integer minor units.
  deposit_cents:
    type: integer
    format: int64
    minimum: 0
    description: Persisted service portion of the booking deposit in integer minor units.
  platform_fee_total_cents:
    type: integer
    format: int64
    minimum: 0
    description: Persisted total platform fee under the contract in integer minor units.
  platform_fee_due_now_cents:
    type: integer
    format: int64
    minimum: 0
    description: Persisted platform-fee portion due with the booking deposit in integer minor units.
  booking_payment_deadline:
    type: string
    format: date-time
    description: Persisted booking-payment deadline.
  amount_due_now_cents:
    type:
      - integer
      - 'null'
    format: int64
    minimum: 0
    description: Contractual booking amount derived from valid persisted terms; null when that derivation is unavailable.
  remaining_service_balance_cents:
    type:
      - integer
      - 'null'
    format: int64
    minimum: 0
    description: Contractual remaining service amount derived from valid persisted terms; not a claim that it is currently collectible.
  remaining_platform_fee_cents:
    type:
      - integer
      - 'null'
    format: int64
    minimum: 0
    description: Contractual remaining platform fee derived from valid persisted terms; null when unavailable.
  remaining_amount_due_cents:
    type:
      - integer
      - 'null'
    format: int64
    minimum: 0
    description: Contractual remaining total derived from valid persisted terms; null when unavailable and not evidence of a pending payment by itself.
additionalProperties: false
