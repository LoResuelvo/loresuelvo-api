type: object
required:
  - approved_amounts
  - pending_amount
  - anomalies
properties:
  approved_amounts:
    type: array
    description: >-
      Gross amounts across all intents of this proposal/order, not only the
      current row or page. Each distinct (processor, external_payment_id)
      persisted as approved is counted once, grouped by currency, including
      anomalous currency or amount values. This is observed gross evidence, not
      net revenue, processor settlement, or a global collection total. An empty
      array means known zero approved transaction evidence.
    items:
      $ref: '#/components/schemas/AdminPaymentAmount'
  pending_amount:
    anyOf:
      - $ref: '#/components/schemas/AdminPaymentAmount'
      - type: 'null'
    description: >-
      Nullable contractual pending amount for the proposal/order. Null when no
      order exists, contract terms are invalid, or a coherent contractual
      position cannot be established. Valid scheduled/awaiting-payment orders
      with a matching paid deposit report the nominal remaining contract amount;
      a paid order reports zero. This is not a processor settlement or a sum of
      pending transaction attempts. Anomalous gross approvals are not subtracted
      or converted when currencies differ.
  anomalies:
    type: array
    description: Proposal/order-wide anomaly flags repeated on each payment row in that proposal/order.
    items:
      type: string
      enum:
        - invalid_contract_terms
        - intent_currency_mismatch
        - intent_contract_amount_mismatch
        - transaction_currency_mismatch
        - transaction_amount_mismatch
        - approved_amount_exceeds_intent_total
        - multiple_approved_transactions
        - paid_without_matching_approved_transaction
        - approved_transaction_intent_status_mismatch
        - contractual_pending_unavailable
    uniqueItems: true
additionalProperties: false
