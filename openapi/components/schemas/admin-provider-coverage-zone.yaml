type: object
description: Complete coverage-zone data visible in the administrative provider directory.
additionalProperties: false
required:
- id
- market_id
- code
- name
- kind
- parent_zone_id
- enabled
properties:
  id:
    type: integer
    format: int32
    minimum: 1
    example: 6
  market_id:
    type: integer
    format: int32
    minimum: 1
    example: 1
  code:
    type: string
    example: CABA-COMUNA-6
  name:
    type: string
    example: Comuna 6
  kind:
    type: string
    enum:
    - COMMUNE
    - PARTY
    - DEPARTMENT
    - NEIGHBORHOOD
    - OPERATIONAL_ZONE
    example: COMMUNE
  parent_zone_id:
    type:
    - integer
    - 'null'
    format: int32
    minimum: 1
    description: Parent coverage-zone identifier, or null when the zone is at the root of its hierarchy.
    example: null
  enabled:
    type: boolean
    description: Whether the coverage zone is currently available for marketplace operations.
    example: true
