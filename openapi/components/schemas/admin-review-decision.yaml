type: object
description: Immutable moderation decision for a review.
required:
  - id
  - work_order_id
  - operator_id
  - action
  - category
  - reason
  - report_id
  - previous_hide_id
  - created_on
properties:
  id:
    type: integer
    format: int32
    minimum: 1
  work_order_id:
    type: integer
    format: int32
    minimum: 1
  operator_id:
    type: integer
    format: int32
    minimum: 1
    description: Internal operator identity resolved from authentication.
  action:
    type: string
    enum: [hide, unhide, dismiss_reports]
  category:
    oneOf:
      - $ref: '#/components/schemas/WorkOrderReviewReportRequest/properties/category'
      - type: 'null'
    description: Present for a hide decision; null for other actions.
  reason:
    type: string
    description: Trimmed administrative reason.
  report_id:
    type: [integer, 'null']
    format: int32
    minimum: 1
    description: Report handled by this decision, or null when no report was selected.
  previous_hide_id:
    type: [integer, 'null']
    format: int32
    minimum: 1
    description: Hiding decision restored by an unhide decision, or null otherwise.
  created_on:
    type: string
    format: date-time
    description: Server-recorded decision instant in UTC.
additionalProperties: false
