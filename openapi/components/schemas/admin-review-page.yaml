type: object
description: Paginated administrative review summaries.
required: [items, page, limit, total]
properties:
  items:
    type: array
    items:
      $ref: '#/components/schemas/AdminReviewSummary'
  page:
    type: integer
    minimum: 1
  limit:
    type: integer
    minimum: 1
    maximum: 100
  total:
    type: integer
    format: int64
    minimum: 0
additionalProperties: false
