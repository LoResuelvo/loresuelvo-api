type: object
description: The single report associated with a review, when one exists.
required: [id, category, explanation, status, created_on]
properties:
  id:
    type: integer
    format: int32
    minimum: 1
  category:
    $ref: '#/components/schemas/WorkOrderReviewReportRequest/properties/category'
  explanation:
    $ref: '#/components/schemas/WorkOrderReviewReportRequest/properties/explanation'
  status:
    type: string
    enum: [pending, upheld, dismissed]
  created_on:
    type: string
    format: date-time
    description: Server-recorded report creation time in UTC.
additionalProperties: false
