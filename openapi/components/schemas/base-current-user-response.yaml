type: object
description: Information shared by every authenticated user profile.
required:
- id
- name
- surname
- email
- role
- calendar_connection_status
properties:
  id:
    type: integer
    format: int32
    example: 10
  name:
    type: string
    example: Ana
  surname:
    type: string
    example: Pérez
  email:
    type: string
    format: email
    example: ana@example.com
  role:
    type: string
    enum:
    - consumer
    - provider
  calendar_connection_status:
    type: string
    enum:
    - disconnected
    - connected
    - action_required
    description: Current calendar authorization status for the authenticated user.
  profile_photo:
    $ref: '#/components/schemas/CurrentUserProfilePhoto'
