type: object
description: Immutable booking terms captured when the service proposal is created. All amounts are expressed in the smallest currency unit.
required:
  - currency
  - service_total_cents
  - deposit_cents
  - remaining_service_balance_cents
  - platform_fee_total_cents
  - platform_fee_due_now_cents
  - remaining_platform_fee_cents
  - amount_due_now_cents
  - remaining_amount_due_cents
  - contract_total_cents
  - booking_payment_deadline
properties:
  currency:
    type: string
    enum:
      - ARS
    example: ARS
  service_total_cents:
    type: integer
    format: int64
    minimum: 1
    example: 10000000
  deposit_cents:
    type: integer
    format: int64
    minimum: 1
    example: 2000000
  remaining_service_balance_cents:
    type: integer
    format: int64
    minimum: 0
    example: 8000000
  platform_fee_total_cents:
    type: integer
    format: int64
    minimum: 0
    example: 500000
  platform_fee_due_now_cents:
    type: integer
    format: int64
    minimum: 0
    example: 100000
  remaining_platform_fee_cents:
    type: integer
    format: int64
    minimum: 0
    example: 400000
  amount_due_now_cents:
    type: integer
    format: int64
    minimum: 1
    example: 2100000
  remaining_amount_due_cents:
    type: integer
    format: int64
    minimum: 0
    example: 8400000
  contract_total_cents:
    type: integer
    format: int64
    minimum: 1
    example: 10500000
  booking_payment_deadline:
    type: string
    format: date-time
    description: Immutable deadline for paying the booking deposit, fixed 24 hours before the scheduled service.
    example: '2026-07-04T12:30:00Z'
additionalProperties: false
