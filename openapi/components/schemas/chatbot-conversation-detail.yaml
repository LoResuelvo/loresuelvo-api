type: object
description: Chatbot-specific conversation state shared by detail and turn responses.
required:
- title
- response_status
- recommended_providers
properties:
  title:
    type: string
    description: Chatbot-generated conversation title.
    example: Pérdida de agua en la cocina
  response_status:
    type: string
    description: Last semantic chatbot response status.
    enum:
    - answered
    - out_of_scope
    example: answered
  assessment:
    $ref: '#/components/schemas/ProblemAssessment'
  recommended_providers:
    type: array
    description: Providers selected by the AI ranker from the deterministic category and coverage-zone eligible candidates, in rank order.
    items:
      $ref: '#/components/schemas/ProviderSummary'
