type: object
description: Chatbot-specific conversation state shared by detail and turn responses.
required:
- title
- response_status
- diagnosis_completed
- recommended_providers
properties:
  title:
    type: string
    description: Chatbot-generated conversation title.
    example: Pérdida de agua en la cocina
  response_status:
    type: string
    description: Last semantic chatbot response status.
    enum:
    - answered
    - out_of_scope
    example: answered
  diagnosis_completed:
    type: boolean
    description: Whether the chatbot concluded the diagnosis.
    example: true
  recommended_category:
    type: object
    nullable: true
    description: Category recommended by the chatbot when diagnosis is complete.
    required:
    - id
    - name
    properties:
      id:
        type: integer
        format: int32
        example: 3
      name:
        type: string
        example: Plomería
    additionalProperties: false
  recommended_providers:
    type: array
    description: Providers derived from the recommended category.
    items:
      $ref: '#/components/schemas/ProviderSummary'
