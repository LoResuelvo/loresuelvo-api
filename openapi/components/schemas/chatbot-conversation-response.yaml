type: object
description: Chatbot conversation creation response, including the chatbot answer and recommended providers when the pre-diagnosis is concluded.
required:
- id
- status
- title
- response_status
- messages
- recommended_providers
properties:
  id:
    type: integer
    format: int32
    description: Chatbot conversation identifier.
    example: 1
  conversation_id:
    type: integer
    format: int32
    description: Chatbot conversation identifier. Present in chatbot turn responses.
    example: 1
  status:
    type: string
    description: Conversation status.
    enum:
    - active
    example: active
  title:
    type: string
    description: Short title generated by the chatbot for the conversation.
    example: Pérdida de agua en la cocina
  response_status:
    type: string
    description: Scope/status of the chatbot answer.
    enum:
    - answered
    - out_of_scope
    example: answered
  messages:
    type: array
    description: Messages persisted in the created chatbot conversation.
    items:
      $ref: '#/components/schemas/ConversationMessage'
  response:
    $ref: '#/components/schemas/ConversationMessage'
  recommended_providers:
    type: array
    description: Providers recommended for the concluded pre-diagnosis. Empty when no matching providers are available or no provider recommendation applies yet.
    items:
      $ref: '#/components/schemas/ProviderSummary'
additionalProperties: false
