description: Chatbot conversation turn response, including the chatbot answer and recommendations when the diagnosis is concluded.
allOf:
- $ref: '#/components/schemas/ChatbotConversationDetail'
- type: object
  required:
  - id
  - status
  - messages
  properties:
    id:
      type: integer
      format: int32
      description: Chatbot conversation identifier.
      example: 1
    status:
      type: string
      description: Conversation status.
      enum:
      - active
      example: active
    messages:
      type: array
      description: Messages persisted for this chatbot turn.
      items:
        $ref: '#/components/schemas/ConversationMessage'
    response:
      $ref: '#/components/schemas/ConversationMessage'
