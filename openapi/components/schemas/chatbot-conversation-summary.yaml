type: object
description: Chatbot conversation summary returned by GET /chatbot/conversations for the authenticated consumer.
required:
- id
- status
- title
- last_message
- updated_on
properties:
  id:
    type: integer
    format: int32
    description: Chatbot conversation identifier.
    example: 1
  status:
    type: string
    description: Conversation status.
    enum:
    - active
    example: active
  title:
    type: string
    description: Short title generated by the chatbot for the conversation.
    example: Pérdida de agua en la cocina
  last_message:
    $ref: '#/components/schemas/ConversationLastMessage'
  updated_on:
    type: string
    format: date-time
    description: Last time the chatbot conversation changed.
    example: '2026-06-18T12:00:00Z'
additionalProperties: false
