type: object
required:
- id
- operation_id
- reference
- status
- created_on
properties:
  id:
    type: integer
    format: int32
    minimum: 1
    description: Claim identifier.
    example: 7
  operation_id:
    type: string
    pattern: '^(jr|sp)-[1-9][0-9]*$'
    description: Canonical operation identifier. A request and its first proposal use jr-N; a later proposal uses sp-N.
    example: jr-12
  reference:
    $ref: '#/components/schemas/ClaimReference'
  status:
    type: string
    enum:
    - open
    - in_review
    - resolved
    - dismissed
    example: open
  created_on:
    type: string
    format: date-time
    description: Server-recorded creation time in UTC.
    example: '2026-10-07T12:30:00Z'
additionalProperties: false
