type: object
required:
- id
- type
- actor_id
- actor_party
- created_on
properties:
  id:
    type: integer
    format: int32
    minimum: 1
  type:
    type: string
    enum: [submitted, review_started, resolved]
  actor_id:
    type: integer
    format: int32
    minimum: 1
  actor_party:
    type: string
    enum: [consumer, provider, operator]
  created_on:
    type: string
    format: date-time
    description: Server-recorded action time in UTC.
additionalProperties: false
