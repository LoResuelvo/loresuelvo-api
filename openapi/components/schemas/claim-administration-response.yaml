type: object
required:
- id
- status
- action
- resolution
properties:
  id:
    type: integer
    format: int32
    minimum: 1
  status:
    type: string
    enum: [open, in_review, resolved, dismissed]
    description: Current claim status, including when returning an idempotent replay.
  action:
    $ref: '#/components/schemas/ClaimAdministrationAction'
  resolution:
    oneOf:
    - $ref: '#/components/schemas/ClaimResolution'
    - type: 'null'
    description: Current persisted resolution, or null if none exists.
additionalProperties: false
