type: object
required:
- id
- operation_id
- reference
- status
- created_on
- reason
- review_started_on
- closed_on
- description
- images
- resolution
properties:
  id:
    type: integer
    format: int32
    minimum: 1
    description: Claim identifier.
    example: 7
  operation_id:
    type: string
    pattern: '^(jr|sp)-[1-9][0-9]*$'
    description: Canonical operation identifier. A request and its first proposal use jr-N; a later proposal uses sp-N.
    example: jr-12
  reference:
    $ref: '#/components/schemas/ClaimReference'
  status:
    type: string
    enum:
    - open
    - in_review
    - resolved
    - dismissed
    example: open
  created_on:
    type: string
    format: date-time
    description: Server-recorded creation time in UTC.
    example: '2026-10-07T12:30:00Z'
  reason:
    type: string
    enum:
    - non_compliance
    - improper_charge
    - damage
    - poor_quality
  review_started_on:
    type: [string, 'null']
    format: date-time
    description: Actual server-recorded start time of review, or null if review has not started.
  closed_on:
    type: [string, 'null']
    format: date-time
    description: Actual server-recorded closure time, or null while the claim is not finalized.
  description:
    type: string
    description: Original testimony submitted by the claimant.
    example: El servicio acordado no fue completado.
  images:
    type: array
    description: Private evidence images linked to this claim, each with a temporary private URL. Only images linked to this claim are included.
    maxItems: 3
    items:
      type: object
      required:
      - file_id
      - url
      properties:
        file_id:
          type: string
          format: uuid
          description: Stable identifier of the linked private evidence image.
        url:
          type: string
          format: uri
          minLength: 1
          description: Temporary private URL for the image. Its expiry does not remove the evidence.
      additionalProperties: false
  resolution:
    oneOf:
    - $ref: '#/components/schemas/ClaimResolution'
    - type: 'null'
    description: Formal resolution once one exists; null before then.
description: Owned claim detail. The other operation participant cannot access this resource unless they are its claimant.
additionalProperties: false
