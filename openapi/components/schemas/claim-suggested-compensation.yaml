type: object
required:
- amount_minor
- currency
- unit
properties:
  amount_minor:
    type: integer
    format: int64
    description: Suggested compensation amount in integer ARS cents; this is not an executed transfer.
    example: 1500
  currency:
    type: string
    description: Currency code for the suggested compensation. The business operates in ARS.
    example: ARS
  unit:
    type: string
    description: Monetary unit used by the amount representation; currently minor.
    enum:
    - minor
    example: minor
additionalProperties: false
