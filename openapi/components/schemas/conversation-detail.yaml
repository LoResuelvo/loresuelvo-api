type: object
description: Conversation detail visible to one of its participants.
required:
- id
- status
- counterpart
- messages
- updated_on
properties:
  id:
    type: integer
    format: int32
    description: Conversation identifier.
    example: 1
  status:
    type: string
    description: Current conversation status.
    enum:
    - pending
    - active
    - rejected
    example: pending
  counterpart:
    $ref: '#/components/schemas/ConversationCounterpart'
  messages:
    type: array
    description: Messages in chronological order.
    items:
      $ref: '#/components/schemas/ConversationMessage'
  updated_on:
    type: string
    format: date-time
    description: Last time the conversation changed.
additionalProperties: false
