type: object
description: Last message preview included in a conversation summary.
required:
- id
- sender_role
- content
- created_on
properties:
  id:
    type: integer
    format: int32
    description: Message identifier.
    example: 1
  sender_role:
    type: string
    description: Role of the participant that sent the message.
    enum:
    - consumer
    - provider
    - chatbot
    example: consumer
  content:
    type: string
    description: Message text preview.
    example: Hola Juan, necesito reparar una pérdida de agua en la cocina. ¿Podrías ayudarme esta semana?
  audio:
    $ref: '#/components/schemas/MessageAudio'
  created_on:
    type: string
    format: date-time
    description: Message creation timestamp.
    example: '2026-05-30T14:20:00Z'
additionalProperties: false
