type: object
description: Message included in a conversation detail response.
required:
- id
- sender_role
- content
- images
- created_on
properties:
  id:
    type: integer
    format: int32
    description: Message identifier.
    example: 1
  sender_role:
    type: string
    description: Role of the participant that sent the message.
    enum:
    - consumer
    - provider
    - chatbot
    example: consumer
  content:
    type: string
    description: Message text.
    example: Hola Juan, necesito reparar una pérdida de agua en la cocina. ¿Podrías ayudarme esta semana?
  images:
    type: array
    items:
      $ref: '#/components/schemas/MessageImage'
  created_on:
    type: string
    format: date-time
    description: Message creation timestamp.
additionalProperties: false
