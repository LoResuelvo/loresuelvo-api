type: object
description: Message included in a conversation detail response.
required:
- id
- conversation_id
- sender_role
- content
properties:
  id:
    type: integer
    format: int32
    description: Message identifier.
    example: 1
  conversation_id:
    type: integer
    format: int32
    description: Conversation that contains this message.
    example: 1
  sender_role:
    type: string
    description: Role of the participant that sent the message.
    enum:
    - consumer
    - provider
    example: consumer
  content:
    type: string
    description: Message text.
    example: Hola Juan, necesito reparar una pérdida de agua en la cocina. ¿Podrías ayudarme esta semana?
additionalProperties: false
