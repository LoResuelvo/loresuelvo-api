type: object
description: Conversation summary returned by GET /conversations for the authenticated participant.
required:
- id
- status
- counterpart
- last_message
- updated_on
properties:
  id:
    type: integer
    format: int32
    description: Conversation identifier.
    example: 1
  status:
    type: string
    description: Current conversation status.
    enum:
    - pending
    - active
    - rejected
    example: pending
  counterpart:
    $ref: '#/components/schemas/ConversationCounterpart'
  last_message:
    $ref: '#/components/schemas/ConversationLastMessage'
  updated_on:
    type: string
    format: date-time
    description: Conversation last update timestamp.
    example: '2026-05-30T14:20:00Z'
additionalProperties: false
