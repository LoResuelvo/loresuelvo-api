type: object
description: Payload accepted by POST /conversations to start a provider work request. The consumer is inferred from the authenticated JWT subject; clients must not send consumer_id or receiver_id.
required:
- provider_id
- content
properties:
  provider_id:
    type: integer
    format: int32
    description: Existing provider identifier selected by the consumer.
    example: 1
  content:
    type: string
    description: Initial message content. Must be non-empty after trimming.
    example: Hola Juan, necesito reparar una pérdida de agua en la cocina. ¿Podrías ayudarme esta semana?
additionalProperties: false
