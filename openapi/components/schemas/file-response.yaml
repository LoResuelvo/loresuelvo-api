type: object
description: Confirmed file returned by the upload confirmation endpoint. Common file metadata is exposed at the top level, while media-specific metadata is nested under the matching variant.
required:
- id
- original_name
- mime_type
- type
properties:
  id:
    type: string
    format: uuid
    description: Confirmed file identifier.
    example: 4af47f1b-97b6-4b32-baa0-b95d6077f919
  url:
    type: string
    format: uri
    description: Public URL for confirmed public files. Omitted for private files.
    example: https://cdn.example/files/2026/06/profile_photo/4af47f1b-97b6-4b32-baa0-b95d6077f919.jpg
  original_name:
    type: string
    description: Original file name selected by the user.
    example: foto-perfil.jpg
  mime_type:
    type: string
    description: Validated MIME type of the confirmed file.
    example: video/mp4
  type:
    type: string
    description: Media variant represented by the response.
    enum:
    - image
    - audio
    - video
    example: video
  audio:
    $ref: '#/components/schemas/FileAudioMetadata'
  video:
    $ref: '#/components/schemas/FileVideoMetadata'
oneOf:
- title: Confirmed image file
  properties:
    type:
      const: image
  not:
    anyOf:
    - required:
      - audio
    - required:
      - video
- title: Confirmed audio file
  required:
  - audio
  properties:
    type:
      const: audio
  not:
    required:
    - video
- title: Confirmed video file
  required:
  - video
  properties:
    type:
      const: video
  not:
    required:
    - audio
additionalProperties: false
