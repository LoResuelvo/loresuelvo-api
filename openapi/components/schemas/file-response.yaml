type: object
required:
- id
- original_name
properties:
  id:
    type: string
    format: uuid
    description: Confirmed file identifier.
    example: 4af47f1b-97b6-4b32-baa0-b95d6077f919
  url:
    type: string
    format: uri
    description: Public URL for confirmed public files. Omitted for private files.
    example: https://cdn.example/files/2026/06/profile_photo/4af47f1b-97b6-4b32-baa0-b95d6077f919.jpg
  original_name:
    type: string
    description: Original file name selected by the user.
    example: foto-perfil.jpg
  mime_type:
    type: string
    description: Validated MIME type. Present for confirmed conversation audio.
    example: audio/webm
  codec:
    type: string
    description: Validated audio codec. Present for confirmed conversation audio.
    example: opus
  duration_seconds:
    type: integer
    format: int32
    minimum: 1
    maximum: 300
    description: Validated audio duration in whole seconds. Present for confirmed conversation audio.
    example: 18
additionalProperties: false
