type: object
description: |
  Register the current login for one app installation. The authenticated user
  and role come from the JWT and persisted account, never from request fields.
  Unknown fields are ignored. Keep the installation ID and secret in private
  app storage across token renewals and account changes; create a new binding
  ID for each login. UUIDs must be canonical lowercase RFC 4122 version 4.
required:
  - installation_secret
  - app
  - fcm_token
  - binding_id
properties:
  installation_secret:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    writeOnly: true
    description: Random possession proof generated by the app. It is hashed at rest and never included in push data or responses.
  app:
    type: string
    enum: [consumer, provider]
    description: Must match the authenticated account role and the installation's original app.
  fcm_token:
    type: string
    minLength: 1
    maxLength: 4096
    writeOnly: true
    description: Current FCM registration token, without whitespace. A token may belong to only one installation.
  locale:
    type: string
    enum: ['', es, en]
    default: es
    description: Language for API-owned notice templates; omitted or empty means Spanish.
  binding_id:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    description: Random ID for the current login. Keep it unchanged when renewing its token or language.
  previous_binding_id:
    anyOf:
      - type: string
        const: ''
      - type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    description: Required when replacing an existing login or switching accounts. Must identify its current binding; omit on first registration. Empty is also accepted as omitted.
additionalProperties: true
