type: object
description: Pending job request summary returned for an authenticated participant and included in the realtime notification sent to its assigned provider. The service address is a snapshot from creation time and is null for legacy requests without one.
required:
- id
- conversation_id
- title
- description
- status
- requester
- images
- service_address
- created_on
properties:
  id:
    type: integer
    format: int32
    description: Job request identifier.
    example: 1
  conversation_id:
    type: integer
    format: int32
    description: Pending conversation linked to this job request.
    example: 10
  title:
    type: string
    description: Job request title.
    example: Reparación de fuga en la cocina
  description:
    type: string
    description: Optional job request description. Empty when omitted.
    example: Hola Ana, necesito reparar una fuga de agua en la cocina. ¿Podrías ayudarme esta semana?
  status:
    type: string
    description: Current job request lifecycle status.
    enum:
    - pending
    - accepted
    example: pending
  requester:
    $ref: '#/components/schemas/JobRequestRequester'
  images:
    type: array
    description: Images attached to the job request with short-lived authorized URLs. Empty when no image was attached.
    maxItems: 3
    items:
      $ref: '#/components/schemas/MessageImage'
  service_address:
    $ref: '#/components/schemas/JobRequestServiceAddress'
  created_on:
    type: string
    format: date-time
    description: Timestamp when the request was created.
additionalProperties: false
