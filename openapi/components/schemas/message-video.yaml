type: object
description: Confirmed private video attached to a conversation message. The URL is scoped to an authorized conversation participant.
required:
- id
- url
- original_name
- mime_type
- video_codec
- duration_seconds
- width
- height
properties:
  id:
    type: string
    format: uuid
    description: Confirmed video file identifier.
    example: 4af47f1b-97b6-4b32-baa0-b95d6077f919
  url:
    type: string
    format: uri
    description: Private, time-limited URL for the authorized participant.
    example: https://storage.example.com/private/video.mp4?signature=...
  original_name:
    type: string
    description: Original video file name selected by the user.
    example: perdida-canilla.mp4
  mime_type:
    type: string
    description: Validated video MIME type.
    enum:
    - video/mp4
    example: video/mp4
  video_codec:
    type: string
    description: Validated video codec.
    enum:
    - h264
    example: h264
  audio_codec:
    type: string
    description: Optional validated audio codec included in the video.
    enum:
    - aac
    example: aac
  duration_seconds:
    type: integer
    format: int32
    minimum: 1
    maximum: 120
    description: Validated duration rounded up to whole seconds.
    example: 24
  width:
    type: integer
    format: int32
    minimum: 1
    maximum: 1920
    description: Validated video width in pixels.
    example: 1080
  height:
    type: integer
    format: int32
    minimum: 1
    maximum: 1920
    description: Validated video height in pixels.
    example: 1920
additionalProperties: false
