type: object
required:
- file_id
- key
- upload_url
- headers
properties:
  file_id:
    type: string
    format: uuid
    description: API file identifier to use when confirming the upload and associating the file.
    example: 4af47f1b-97b6-4b32-baa0-b95d6077f919
  key:
    type: string
    description: Storage object key generated by the API.
    example: files/2026/06/profile_photo/4af47f1b-97b6-4b32-baa0-b95d6077f919.jpg
  upload_url:
    type: string
    format: uri
    description: URL where the client uploads the file bytes directly.
    example: https://storage.example/upload-url
  headers:
    type: object
    additionalProperties:
      type: string
    description: >-
      Include every returned header unchanged when uploading the file bytes. For
      claim evidence, this includes If-None-Match: * to make the object upload
      create-only; omitting a signed header can cause storage to reject the
      upload.
    example:
      Content-Type: image/jpeg
      If-None-Match: '*'
additionalProperties: false
