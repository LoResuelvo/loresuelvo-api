type: object
required: [from, to, booking_deposit_cents, service_balance_cents, total_cents]
properties:
  from:
    type: string
    format: date-time
    description: Inclusive bucket start, clipped to the requested interval and serialized in UTC.
  to:
    type: string
    format: date-time
    description: Exclusive bucket end, clipped to the requested interval and serialized in UTC.
  booking_deposit_cents:
    type: integer
    format: int64
    minimum: 0
  service_balance_cents:
    type: integer
    format: int64
    minimum: 0
  total_cents:
    type: integer
    format: int64
    minimum: 0
additionalProperties: false
