type: object
required: [from, to, granularity, time_zone]
properties:
  from:
    type: string
    format: date-time
    description: Inclusive beginning of the requested interval, serialized in UTC.
  to:
    type: string
    format: date-time
    description: Exclusive end of the requested interval, serialized in UTC.
  granularity:
    type: string
    enum: [day, week, month]
    description: Calendar grouping in Argentina/Buenos Aires time.
  time_zone:
    type: string
    const: America/Argentina/Buenos_Aires
additionalProperties: false
