type: object
required: [id, verified_on, purpose, seller_amount_cents, currency, service_proposal_id, work_order_id]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Local payment transaction identifier, not the external payment ID.
  verified_on:
    type: string
    format: date-time
    description: Approval verification instant, serialized in UTC.
  purpose:
    type: string
    enum: [booking_deposit, service_balance]
  seller_amount_cents:
    type: integer
    format: int64
    minimum: 1
    description: Contractual amount owed to the provider, excluding platform fees.
  currency:
    type: string
    const: ARS
  service_proposal_id:
    type: integer
    minimum: 1
  work_order_id:
    type: integer
    minimum: 1
    description: Local work-order identifier associated with the approved collection.
additionalProperties: false
