type: object
required:
- from
- to
- time_zone
properties:
  from:
    type: string
    format: date-time
    description: Inclusive creation bound, normalized to UTC without dropping nanosecond precision.
  to:
    type: string
    format: date-time
    description: Exclusive creation bound, normalized to UTC without dropping nanosecond precision.
  time_zone:
    type: string
    const: America/Argentina/Buenos_Aires
    description: Informational time zone; membership is determined by the supplied instants.
additionalProperties: false
