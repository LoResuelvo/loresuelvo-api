description: Complete authenticated Provider profile.
allOf:
- $ref: '#/components/schemas/BaseCurrentUserResponse'
- type: object
  required:
    - role
    - category
    - identity_verification_status
    - identity_verified_on
  properties:
    role:
      type: string
      enum:
      - provider
    category:
      $ref: '#/components/schemas/CategoryListItem'
    identity_verification_status:
      type: string
      enum:
      - unverified
      - not_started
      - in_progress
      - awaiting_user
      - in_review
      - approved
      - declined
      - resubmitted
      - abandoned
      - expired
      - kyc_expired
      description: Current identity-verification status for the authenticated provider.
    identity_verified_on:
      type: string
      format: date-time
      nullable: true
      description: Timestamp at which the provider's identity was approved, or null when it is not approved.
