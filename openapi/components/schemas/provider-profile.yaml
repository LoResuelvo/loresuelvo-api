type: object
description: Public Provider profile available to authenticated users.
required:
- id
- name
- surname
- profile_photo
- category
- rating_average
- rating_count
- identity_verified
- work_orders
properties:
  id:
    type: integer
    format: int32
    example: 12
  name:
    type: string
    example: Juan
  surname:
    type: string
    example: Gómez
  profile_photo:
    $ref: '#/components/schemas/CurrentUserProfilePhoto'
  category:
    $ref: '#/components/schemas/CategoryListItem'
  rating_average:
    type: number
    format: double
    minimum: 0
    maximum: 5
    description: Average of all registered provider ratings, including ratings whose review text is hidden.
    example: 4.5
  rating_count:
    type: integer
    format: int32
    minimum: 0
    description: Number of all registered provider reviews, including hidden reviews.
    example: 2
  identity_verified:
    type: boolean
    example: true
  work_orders:
    type: array
    items:
      $ref: '#/components/schemas/ProviderProfileWorkOrder'
additionalProperties: false
