type: object
description: Provider summary returned by GET /providers when filtering by category_id.
required:
- id
- name
- surname
- category_name
properties:
  id:
    type: integer
    format: int32
    description: Provider identifier.
    example: 1
  name:
    type: string
    description: Provider given name.
    example: Juan
  surname:
    type: string
    description: Provider surname.
    example: Pérez
  category_name:
    type: string
    description: Provider category display name.
    example: Plomería
additionalProperties: false
