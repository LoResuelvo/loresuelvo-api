type: object
description: Provider summary returned after provider registration and by GET /providers when filtering by category_id.
required:
- id
- name
- surname
- category_name
- profile_photo_url
properties:
  id:
    type: integer
    format: int32
    description: Provider identifier.
    example: 1
  name:
    type: string
    description: Provider given name.
    example: Juan
  surname:
    type: string
    description: Provider surname.
    example: Pérez
  category_name:
    type: string
    description: Provider category display name.
    example: Plomería
  profile_photo_url:
    type: string
    format: uri
    description: Public provider profile photo URL.
    example: https://cdn.example/files/2026/06/profile_photo/4af47f1b-97b6-4b32-baa0-b95d6077f919.jpg
additionalProperties: false
