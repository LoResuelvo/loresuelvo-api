type: object
description: Notification payload sent through the realtime WebSocket channel.
required:
  - id
  - user_id
  - type
  - resource_type
  - resource_id
  - read_at
  - created_at
properties:
  id:
    type: integer
    format: int32
    minimum: 1
    example: 15
  user_id:
    type: integer
    format: int32
    minimum: 1
    description: User that owns the notification.
    example: 1
  type:
    type: string
    enum:
      - service_proposal_received
      - service_proposal_accepted
      - service_proposal_rejected
      - work_order_close_to_scheduled_time
    example: service_proposal_received
  resource_type:
    type: string
    enum:
      - service_proposal
      - work_order
    example: service_proposal
  resource_id:
    type: integer
    format: int32
    minimum: 1
    description: Identifier of the resource referenced by the notification.
    example: 10
  estimated_duration_minutes:
    type: integer
    format: int32
    minimum: 15
    maximum: 1440
    description: Estimated service duration in minutes when the notification references a service proposal.
    example: 60
  read_at:
    type:
      - string
      - 'null'
    format: date-time
    description: Null when the notification has not been read.
    example: null
  created_at:
    type: string
    format: date-time
    example: '2026-07-04T13:00:00Z'
additionalProperties: false
