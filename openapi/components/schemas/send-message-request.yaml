type: object
description: Payload accepted by POST /conversations/{conversationId}/messages. The sender is inferred from the authenticated JWT subject. A message may contain text and/or images, or one confirmed audio file exclusively.
anyOf:
- required: [content]
- required: [image_file_ids]
- required: [audio_file_id]
not:
  anyOf:
  - required: [audio_file_id, content]
  - required: [audio_file_id, image_file_ids]
properties:
  content:
    type: string
    description: Optional message text. Must be non-empty after trimming when no images are provided.
    example: ¿El jueves por la mañana te queda cómodo para pasar a revisar el problema?
  image_file_ids:
    type: array
    description: Confirmed private conversation-image files uploaded by the authenticated sender.
    maxItems: 5
    uniqueItems: true
    items:
      type: string
      format: uuid
  audio_file_id:
    type: string
    format: uuid
    description: Confirmed private WebM/Opus audio file uploaded by the authenticated sender. It cannot be combined with text or images.
additionalProperties: false
