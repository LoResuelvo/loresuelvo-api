type: object
description: Message created in a conversation by one of its participants.
required:
- id
- conversation_id
- sender_role
- content
- images
- created_on
properties:
  id:
    type: integer
    format: int32
    description: Message identifier.
    example: 2
  conversation_id:
    type: integer
    format: int32
    description: Conversation that owns the message.
    example: 1
  sender_role:
    type: string
    description: Role of the participant that sent the message.
    enum:
    - consumer
    - provider
    example: consumer
  content:
    type: string
    description: Message text.
    example: ¿El jueves por la mañana te queda cómodo para pasar a revisar el problema?
  images:
    type: array
    items:
      $ref: '#/components/schemas/MessageImage'
  audio:
    $ref: '#/components/schemas/MessageAudio'
  created_on:
    type: string
    format: date-time
    description: Message creation timestamp.
    example: '2026-05-31T12:00:00Z'
additionalProperties: false
