type: object
required:
  - id
  - conversation_id
  - amount_cents
  - scheduled_on
  - description
  - estimated_duration_minutes
  - status
  - created_on
  - counterpart
  - booking_terms
properties:
  id:
    type: integer
    minimum: 1
  conversation_id:
    type: integer
    minimum: 1
  amount_cents:
    type: integer
    format: int64
    minimum: 1
    description: Provider's total service price expressed in cents, excluding the platform fee.
  scheduled_on:
    type: string
    format: date-time
  description:
    type: string
  estimated_duration_minutes:
    type: integer
    format: int32
    minimum: 15
    maximum: 1440
    description: Estimated service duration in minutes.
    example: 60
  status:
    type: string
    enum:
      - pending
      - accepted
      - rejected
  created_on:
    type: string
    format: date-time
  counterpart:
    $ref: '#/components/schemas/ServiceProposalCounterpart'
  booking_terms:
    $ref: '#/components/schemas/BookingTerms'
