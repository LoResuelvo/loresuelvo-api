type: object
description: Completion evidence recorded for a work order.
required:
  - id
  - description
  - reported_on
  - images
properties:
  id:
    type: integer
    minimum: 1
  description:
    type: string
    minLength: 1
  reported_on:
    type: string
    format: date-time
  images:
    type: array
    minItems: 1
    maxItems: 3
    items:
      $ref: '#/components/schemas/WorkOrderCompletionImage'
additionalProperties: false
