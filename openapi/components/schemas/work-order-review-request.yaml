type: object
description: Review submitted by the consumer for a paid work order.
required:
  - rating
properties:
  rating:
    type: integer
    minimum: 1
    maximum: 5
    description: Whole-number rating from one to five stars.
    example: 5
  description:
    type: string
    maxLength: 500
    description: Optional review description. An omitted description is returned as an empty string.
    example: Trabajo prolijo y excelente atención.
additionalProperties: false
