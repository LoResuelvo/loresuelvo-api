type: object
description: Scheduled work order created from an accepted service proposal.
required:
  - id
  - service_proposal_id
  - consumer_id
  - provider_id
  - amount_cents
  - scheduled_on
  - description
  - status
  - accepted_on
properties:
  id:
    type: integer
    minimum: 1
  service_proposal_id:
    type: integer
    minimum: 1
  consumer_id:
    type: integer
    minimum: 1
  provider_id:
    type: integer
    minimum: 1
  amount_cents:
    type: integer
    format: int64
    minimum: 1
  scheduled_on:
    type: string
    format: date-time
  description:
    type: string
    minLength: 1
  status:
    type: string
    enum:
      - scheduled
  accepted_on:
    type: string
    format: date-time
additionalProperties: false
