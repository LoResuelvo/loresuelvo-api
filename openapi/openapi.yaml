- name: Health
  description: Service availability endpoints.
- name: Categories
  description: Service category management endpoints.
- name: CoverageZones
  description: Coverage-zone catalog endpoints.
- name: Consumers
  description: Consumer account registration endpoints.
- name: Providers
  description: Provider account registration and search endpoints.
- name: PaymentAccounts
  description: Provider payment account connection endpoints.
- name: CalendarConnections
  description: Authenticated calendar connection endpoints.
- name: Payments
  description: Checkout and verified payment processing endpoints.
- name: Files
  description: File upload endpoints.
- name: Conversations
  description: Provider work request conversation endpoints.
- name: JobRequests
  description: Job request creation endpoints.
- name: ServiceProposals
  description: Service proposal endpoints.
- name: WorkOrders
  description: Work order endpoints.
- name: Users
  description: Authenticated user session endpoints.
- name: IdentityVerification
  description: Identity-verification status processing endpoints.
- name: Realtime
  description: WebSocket real-time messaging endpoints.
