openapi: 3.1.0
info:
  title: LoResuelvo API
  description: OpenAPI documentation for the LoResuelvo HTTP API as implemented by
    the current Gin routes.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
- url: http://localhost:8080
  description: Local development server
- url: /
  description: Current API host
tags:
- name: Health
  description: Service availability endpoints.
- name: Categories
  description: Service category management endpoints.
- name: Consumers
  description: Consumer account registration endpoints.
- name: Providers
  description: Provider account registration and search endpoints.
- name: Files
  description: File upload endpoints.
- name: Conversations
  description: Provider work request conversation endpoints.
- name: JobRequests
  description: Job request creation endpoints.
- name: Users
  description: Authenticated user session endpoints.
- name: Realtime
  description: WebSocket real-time messaging endpoints.
paths:
  /:
    $ref: ./paths/health.yaml
  /categories:
    $ref: ./paths/categories.yaml
  /consumers:
    $ref: ./paths/consumers.yaml
  /providers:
    $ref: ./paths/providers.yaml
  /files/presign:
    $ref: ./paths/files-presign.yaml
  /files/{fileID}/confirm:
    $ref: ./paths/file-confirm.yaml
  /conversations:
    $ref: ./paths/conversations.yaml
  /chatbot/conversations:
    $ref: ./paths/chatbot-conversations.yaml
  /chatbot/conversations/{conversationId}/messages:
    $ref: ./paths/chatbot-conversation-messages.yaml
  /chatbot/conversations/{conversationId}/job-requests:
    $ref: ./paths/chatbot-conversation-job-requests.yaml
  /job-requests:
    $ref: ./paths/job-requests.yaml
  /job-requests/{jobRequestID}/accept:
    $ref: ./paths/job-request-accept.yaml
  /conversations/{conversationId}:
    $ref: ./paths/conversation-by-id.yaml
  /conversations/{conversationId}/messages:
    $ref: ./paths/conversation-messages.yaml
  /me:
    $ref: ./paths/users.yaml
  /ws:
    get:
      summary: WebSocket for real-time messages
      description: |
        Establishes a WebSocket connection for real-time message delivery.
        Authentication is handled by the Gin middleware chain — the JWT token
        must be provided in the `Authorization` header, identical to HTTP endpoints.

        Once connected, the client receives push events for message activity
        in conversations where they participate. No query parameters are needed;
        conversation filtering happens at publish time based on the sender's context.

        **Event format:**
        ```json
        {
          "type": "conversation.message.created",
          "conversation_id": 123,
          "message": {
            "id": 456,
            "sender_role": "consumer",
            "content": "Hola, necesito un presupuesto",
            "created_on": "2026-06-04T12:00:00Z"
          }
        }
        ```
      tags:
        - Realtime
      responses:
        '101':
          description: Switching Protocols — WebSocket connection upgraded successfully
        '401':
          description: Unauthorized — Missing or invalid JWT token
