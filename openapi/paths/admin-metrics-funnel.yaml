get:
  tags:
    - Administration
  operationId: getAdminFunnelMetrics
  summary: Get administrative hiring funnel metrics
  description: >-
    Returns aggregate conversion counts and mean delays for separate
    AI-originated and manual hiring cohorts. Requires a Bearer JWT with the
    exact `read:admin_metrics` permission; a local administrator role or other
    administrative permissions do not substitute for it. This is a read-only
    query over one coherent read snapshot. It does not persist an audit event,
    change business state, call external services, or return individual rows,
    personal data, conversations, or financial payloads. Every response,
    including authentication and validation errors, uses
    `Cache-Control: private, no-store`.

    **Period and filters.** Supply both `from` and `to`, or omit both. Each is
    an RFC 3339 timestamp with a time-zone offset; the interval is inclusive
    at `from` and exclusive at `to`. When omitted, the effective interval is
    the exact preceding 30 × 24 hours ending at the observation instant.
    `from` must precede `to`, the interval cannot exceed 365 × 24 hours, and
    `to` cannot be later than `observed_at`. An optional positive `category_id`
    filters origin units; an unknown positive ID returns empty aggregates.
    The response reports the effective bounds, `America/Argentina/Buenos_Aires`
    time zone, observation instant, and decimal-rounding metadata.

    **Cohorts and stages.** The AI cohort starts with distinct persisted
    `professional_required` assessment versions created in the selected
    period. Its category source is the assessment's
    `problem_category_id`; a later current assessment does not replace the
    assessment that sourced a request. The manual cohort starts with distinct
    requests created in the period whose `source_assessment_id` is absent;
    its category source is the destination provider's current category, not
    historical request data. Cohorts and denominators remain separate. AI
    stages are `professional_assessment`, `request`, `proposal`,
    `confirmed_hiring`, `reported_completion`, `full_payment`, and `review`;
    manual stages omit only `professional_assessment`. Each unit contributes
    at most once to a stage through its own persisted request/proposal/order
    branch. Hiring requires the linked order's `accepted_on`, completion its
    persisted report, full payment `paid_on` on that same completed order,
    and review a review associated with that paid order. The selected period
    filters origins only: later linked milestones may occur after `to` and
    still count. Once an origin unit reaches a stage, it remains counted at
    that stage; consequently a later aggregate stage cannot contain more
    units than its preceding stage.

    **Conversions and delays.** Each stage after the first reports
    `100 × current stage count / preceding stage count`; global completion
    conversion uses the origin count as denominator and the reported
    completion count as numerator. A zero denominator is `null`; a positive
    denominator with no progress yields `0.00`. Percentages and delay means
    are rounded half up to two decimal places. Delay means are seconds and
    include an observation count. The four intervals are request to earliest
    proposal (one sample per request), proposal to confirmed hiring, hiring
    to reported completion, and completion to full payment (each latter
    interval one sample per linked order). Only persisted endpoint pairs in
    valid chronological order contribute; missing or negative intervals are
    excluded, and pending wait is not measured. No valid observations yields
    a null mean. Read/projection failure returns an error, never synthetic
    zero metrics or a partial aggregate.
  security:
    - BearerAuth: []
  parameters:
    - name: from
      in: query
      required: false
      description: >-
        Inclusive RFC 3339 timestamp with time-zone offset. Supply with `to`;
        omit both to use the exact preceding 30 × 24-hour period.
      schema:
        type: string
        format: date-time
      example: '2026-09-10T00:00:00Z'
    - name: to
      in: query
      required: false
      description: >-
        Exclusive RFC 3339 timestamp with time-zone offset. Supply with `from`;
        it must be no later than the observation instant, and the range may
        not exceed 365 × 24 hours.
      schema:
        type: string
        format: date-time
      example: '2026-09-11T00:00:00Z'
    - name: category_id
      in: query
      required: false
      description: >-
        Positive category ID used to filter origin units. AI uses the source
        assessment's problem category; manual requests use the destination
        provider's current category. Unknown positive IDs produce empty
        aggregates.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 7
  responses:
    '200':
      description: Aggregate hiring funnel and delay metrics for both cohorts.
      headers:
        Cache-Control:
          description: Prevents storage of private administrative metrics.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminFunnelMetrics'
          examples:
            populated:
              summary: Distinct AI and manual origin cohorts with aggregate stage and delay metrics
              value:
                period:
                  from: '2026-09-10T00:00:00Z'
                  to: '2026-09-11T00:00:00Z'
                timezone: America/Argentina/Buenos_Aires
                observed_at: '2026-09-30T15:00:00Z'
                category_id: null
                rounding: half_up
                decimal_places: 2
                cohorts:
                  ai:
                    category_source: assessment.problem_category_id
                    stages:
                      - {stage: professional_assessment, count: 3, conversion_percentage: null}
                      - {stage: request, count: 2, conversion_percentage: 66.67}
                      - {stage: proposal, count: 2, conversion_percentage: 100.00}
                      - {stage: confirmed_hiring, count: 2, conversion_percentage: 100.00}
                      - {stage: reported_completion, count: 2, conversion_percentage: 100.00}
                      - {stage: full_payment, count: 1, conversion_percentage: 50.00}
                      - {stage: review, count: 1, conversion_percentage: 100.00}
                    global_completion_conversion_percentage: 66.67
                    delays:
                      request_to_first_proposal: {observations: 2, mean_seconds: 33.34}
                      proposal_to_confirmed_hiring: {observations: 3, mean_seconds: 14.17}
                      confirmed_hiring_to_reported_completion: {observations: 2, mean_seconds: 172820.00}
                      reported_completion_to_full_payment: {observations: 1, mean_seconds: 40.00}
                  manual:
                    category_source: provider.current_category_id
                    stages:
                      - {stage: request, count: 0, conversion_percentage: null}
                      - {stage: proposal, count: 0, conversion_percentage: null}
                      - {stage: confirmed_hiring, count: 0, conversion_percentage: null}
                      - {stage: reported_completion, count: 0, conversion_percentage: null}
                      - {stage: full_payment, count: 0, conversion_percentage: null}
                      - {stage: review, count: 0, conversion_percentage: null}
                    global_completion_conversion_percentage: null
                    delays:
                      request_to_first_proposal: {observations: 0, mean_seconds: null}
                      proposal_to_confirmed_hiring: {observations: 0, mean_seconds: null}
                      confirmed_hiring_to_reported_completion: {observations: 0, mean_seconds: null}
                      reported_completion_to_full_payment: {observations: 0, mean_seconds: null}
            empty:
              summary: Empty cohorts retain zero counts and null denominatorless metrics
              value:
                period:
                  from: '2026-08-31T15:00:00Z'
                  to: '2026-09-30T15:00:00Z'
                timezone: America/Argentina/Buenos_Aires
                observed_at: '2026-09-30T15:00:00Z'
                category_id: 2147483000
                rounding: half_up
                decimal_places: 2
                cohorts:
                  ai:
                    category_source: assessment.problem_category_id
                    stages:
                      - {stage: professional_assessment, count: 0, conversion_percentage: null}
                      - {stage: request, count: 0, conversion_percentage: null}
                      - {stage: proposal, count: 0, conversion_percentage: null}
                      - {stage: confirmed_hiring, count: 0, conversion_percentage: null}
                      - {stage: reported_completion, count: 0, conversion_percentage: null}
                      - {stage: full_payment, count: 0, conversion_percentage: null}
                      - {stage: review, count: 0, conversion_percentage: null}
                    global_completion_conversion_percentage: null
                    delays:
                      request_to_first_proposal: {observations: 0, mean_seconds: null}
                      proposal_to_confirmed_hiring: {observations: 0, mean_seconds: null}
                      confirmed_hiring_to_reported_completion: {observations: 0, mean_seconds: null}
                      reported_completion_to_full_payment: {observations: 0, mean_seconds: null}
                  manual:
                    category_source: provider.current_category_id
                    stages:
                      - {stage: request, count: 0, conversion_percentage: null}
                      - {stage: proposal, count: 0, conversion_percentage: null}
                      - {stage: confirmed_hiring, count: 0, conversion_percentage: null}
                      - {stage: reported_completion, count: 0, conversion_percentage: null}
                      - {stage: full_payment, count: 0, conversion_percentage: null}
                      - {stage: review, count: 0, conversion_percentage: null}
                    global_completion_conversion_percentage: null
                    delays:
                      request_to_first_proposal: {observations: 0, mean_seconds: null}
                      proposal_to_confirmed_hiring: {observations: 0, mean_seconds: null}
                      confirmed_hiring_to_reported_completion: {observations: 0, mean_seconds: null}
                      reported_completion_to_full_payment: {observations: 0, mean_seconds: null}
    '400':
      description: >-
        Query parameter is unknown, empty, duplicated, malformed, or invalid;
        `from` and `to` must be supplied together, bounds must be ordered, the
        range cannot exceed 365 × 24 hours, and `to` cannot exceed the
        observation instant. No metrics are returned.
      headers:
        Cache-Control:
          description: Prevents storage of private administrative responses.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid funnel query
    '401':
      description: The Bearer JWT is missing or invalid.
      headers:
        Cache-Control:
          description: Prevents storage of private administrative responses.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The valid JWT does not contain the `read:admin_metrics` permission.
      headers:
        Cache-Control:
          description: Prevents storage of private administrative responses.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: insufficient permissions
    '500':
      description: >-
        The coherent aggregate read or projection failed. No partial result,
        synthetic zero metrics, or audit record is returned.
      headers:
        Cache-Control:
          description: Prevents storage of private administrative responses.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
