get:
  tags:
  - Administration
  operationId: listAdminProviders
  summary: List registered providers
  description: Returns registered providers with their operational information, optionally filtered by name, surname, or email and provider attributes. Multiple filters are combined with AND. Requires the `read:providers` permission in the Bearer JWT.
  security:
  - BearerAuth: []
  parameters:
  - name: q
    in: query
    required: false
    description: Case-insensitive substring to match against provider name, surname, or email. Omit or leave empty to match all providers.
    schema:
      type: string
    example: GÓMEZ
  - name: category_id
    in: query
    required: false
    description: Match providers registered in this category. Must be one positive integer; an ID with no matches returns an empty array.
    schema:
      type: integer
      minimum: 1
    example: 1
  - name: coverage_zone_id
    in: query
    required: false
    description: Match providers assigned to this coverage zone. Must be one positive integer; all of each matched provider's coverage zones remain in the response.
    schema:
      type: integer
      minimum: 1
    example: 6
  - name: identity_verification_status
    in: query
    required: false
    description: Match the provider's latest verification status; providers without verification sessions match unverified. Must be supplied once with a supported status.
    schema:
      type: string
      enum:
      - unverified
      - not_started
      - in_progress
      - awaiting_user
      - in_review
      - approved
      - declined
      - resubmitted
      - abandoned
      - expired
      - kyc_expired
    example: approved
  responses:
    '200':
      description: Provider directory returned successfully. The array is empty when no providers match.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AdminProviderDirectoryItem'
          examples:
            providers:
              value:
              - id: 12
                role: provider
                name: Juan
                surname: Gómez
                email: juan@example.com
                profile_photo_url: https://cdn.example/profile.jpg
                created_on: '2026-09-18T12:00:00Z'
                category:
                  id: 1
                  name: Plomería
                coverage_zones:
                - id: 6
                  market_id: 1
                  code: CABA-COMUNA-6
                  name: Comuna 6
                  kind: COMMUNE
                  parent_zone_id: null
                  enabled: true
                identity_verification_status: approved
                identity_verified_on: '2026-09-18T15:30:00Z'
            unverifiedProvider:
              value:
              - id: 13
                role: provider
                name: Laura
                surname: Díaz
                email: laura@example.com
                profile_photo_url: null
                created_on: '2026-09-18T13:00:00Z'
                category:
                  id: 1
                  name: Plomería
                coverage_zones: []
                identity_verification_status: unverified
                identity_verified_on: null
            empty:
              value: []
    '400':
      description: A category, coverage-zone, or verification-status filter is empty, repeated, or invalid (a non-positive or non-integer ID, or an unsupported status). An empty `q` is allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid filter
    '401':
      description: The Bearer token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The Bearer token does not contain the `read:providers` permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: insufficient permissions
    '500':
      description: The provider directory could not be prepared.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
