get:
  tags:
    - Administration
  operationId: listAdminReviews
  summary: List review summaries for moderation
  description: >-
    Returns one bounded summary per review, ordered by work-order ID descending.
    The review identity is its `work_order_id`; a row is not duplicated by
    reports or decisions. The summary includes no original review text, report
    explanation, or administrative reason. `reported_on` is the creation time
    of the review's single report, when one exists; it is not a publication
    timestamp. The `reported` filter selects reviews with a pending report, not
    every review that has ever been reported. Hidden reviews retain their rating
    and can be queried using `status=hidden`. Unknown or repeated query
    parameters are rejected. Requires `read:admin_reviews` in the Bearer JWT.
    At most one report may exist for a review throughout its lifetime, including
    after handling or later visibility changes.
    Responses use `Cache-Control: private, no-store`.
  security:
    - BearerAuth: []
  parameters:
    - name: status
      in: query
      required: false
      description: >-
        Review view to list. Defaults to `reported`, which means a review with
        a pending report, independently of visibility. `visible`, `hidden`, and
        `all` filter by visibility or include every review, independently of
        whether a report exists.
      schema:
        type: string
        enum: [reported, visible, hidden, all]
        default: reported
    - name: page
      in: query
      required: false
      description: 1-based page number; defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: limit
      in: query
      required: false
      description: Number of review summaries per page; defaults to 20 and is capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: Bounded review summaries matching the selected view.
      headers:
        Cache-Control:
          description: Prevents storage of private administrative review data.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminReviewPage'
          examples:
            noPendingReports:
              summary: The default reported view is empty when no report is pending.
              value:
                items: []
                page: 1
                limit: 20
                total: 0
    '400':
      description: A filter, pagination value, repeated query parameter, or unsupported query parameter is invalid.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401':
      description: The Bearer token is missing or invalid.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The Bearer token lacks the `read:admin_reviews` permission.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      description: The administrative review summaries could not be read.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
