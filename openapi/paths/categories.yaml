get:
  tags:
  - Categories
  operationId: listCategories
  summary: List service categories
  description: >-
    Returns categories ordered by name. By default, the shared catalog contains
    only enabled categories and each item contains `id` and `name`; this mode
    requires a valid Bearer JWT but no administrative permission. Set
    `include_disabled=true` to include enabled and disabled categories and
    receive their `id`, `name`, `enabled`, and `version`; that mode requires
    `read:categories`, returns `Cache-Control: private, no-store`, and does not
    create an audit event. A disabled category remains an existing resource;
    its identifier is not treated as not found.
  security:
  - BearerAuth: []
  parameters:
  - name: include_disabled
    in: query
    required: false
    description: >-
      Include disabled categories. Only `true` selects the administrative
      representation and requires `read:categories`; omitted or `false` keeps
      the enabled-only public catalog.
    schema:
      type: boolean
      default: false
  responses:
    '200':
      description: >-
        Categories returned successfully. The array may be empty. The item
        representation depends on `include_disabled`; an empty array is valid
        in either mode.
      headers:
        Cache-Control:
          description: Present as `private, no-store` when `include_disabled=true`.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/CategoryListItem'
            - type: array
              items:
                $ref: '#/components/schemas/AdminCategory'
          examples:
            withCategories:
              summary: Enabled-only catalog (`include_disabled` omitted or false)
              value:
              - id: 1
                name: Electricidad
              - id: 2
                name: Plomería
            withDisabledCategories:
              summary: Administrative catalog (`include_disabled=true`)
              value:
              - id: 1
                name: Electricidad
                enabled: true
                version: 2
              - id: 2
                name: Plomería
                enabled: false
                version: 3
            empty:
              value: []
    '400':
      description: '`include_disabled` is not a valid boolean value.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Invalid include_disabled
    '401':
      description: Authentication failed or the authenticated user id could not be
        obtained from the request context.
      headers:
        Cache-Control:
          description: Present as `private, no-store` when `include_disabled=true`.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            invalidToken:
              summary: Missing or invalid Bearer token
              value:
                error: invalid_token
                message: Failed to validate JWT.
            missingClaims:
              summary: JWT claims not available after validation
              value:
                error: missing claims
            missingUserId:
              summary: Subject claim is missing or empty
              value:
                error: missing user id
    '403':
      description: The Bearer JWT lacks `read:categories` when `include_disabled=true`.
      headers:
        Cache-Control:
          description: Prevents storage of administrative catalog responses.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: insufficient permissions
    '500':
      description: The category repository returned an unexpected error.
      headers:
        Cache-Control:
          description: Present as `private, no-store` when `include_disabled=true`.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            repositoryError:
              value:
                error: Internal Server Error
post:
  tags:
  - Categories
  operationId: createCategory
  summary: Create a service category
  description: Creates a category using the provided name. The domain trims surrounding
    whitespace, enforces a maximum of 100 Unicode characters, and stores a lowercase
    normalized_name for duplicate checks. The category and its successful audit event
    are committed atomically. If persisting either one fails, the API returns a
    controlled 500 response and neither the new category nor a successful audit event
    is committed. Requires the create:categories permission.
  security:
  - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateCategoryRequest'
        examples:
          validCategory:
            summary: Valid category creation
            value:
              name: Plomería
  responses:
    '201':
      description: Category and its successful audit event were committed atomically.
      headers:
        Location:
          description: Relative URI of the created category.
          schema:
            type: string
          example: /categories/1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Category'
          examples:
            created:
              value:
                id: 1
                name: Plomería
                normalized_name: plomería
    '400':
      description: The request body is invalid, the name is not text, the name is empty
        after trimming, or it exceeds 100 Unicode characters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            nameRequired:
              value:
                error: Category name is required
            invalidJson:
              summary: Invalid JSON body
              value:
                error: Invalid request body
            nameMustBeText:
              summary: Category name has the wrong JSON type
              value:
                error: Category name must be text
            nameTooLong:
              summary: Category name exceeds 100 characters
              value:
                error: Category name is too long
    '401':
      description: Authentication failed or the authenticated user id could not be
        obtained from the request context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            invalidToken:
              summary: Missing or invalid Bearer token
              value:
                error: invalid_token
                message: Failed to validate JWT.
            missingClaims:
              summary: JWT claims not available after validation
              value:
                error: missing claims
            missingUserId:
              summary: Subject claim is missing or empty
              value:
                error: missing user id
    '409':
      description: A category with the same normalized name already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            categoryAlreadyExists:
              value:
                error: Category already exists
    '403':
      description: The authenticated principal does not have the create:categories permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: insufficient permissions
    '500':
      description: Category or audit-event persistence failed. The API returns a
        controlled error, and neither the new category nor a successful audit event
        is committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal Server Error
