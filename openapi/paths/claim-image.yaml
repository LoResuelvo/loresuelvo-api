parameters:
- name: id
  in: path
  required: true
  description: Positive 32-bit claim identifier.
  schema:
    type: integer
    format: int32
    minimum: 1
- name: file_id
  in: path
  required: true
  description: UUID of a private evidence image linked to the owned claim.
  schema:
    type: string
    format: uuid
get:
  tags:
  - Claims
  operationId: getMyClaimEvidenceImage
  summary: Resolve my claim evidence image
  description: Authorizes the claim owner and verifies that the image is linked to that claim before returning a temporary private URL. The URL is not a public or permanent evidence reference.
  security:
  - BearerAuth: []
  responses:
    '200':
      description: Temporary private image URL resolved.
      headers:
        Cache-Control:
          description: Private response that must not be stored.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaimImageURL'
    '401':
      description: Authentication failed or authenticated user could not be obtained.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The authenticated account is not enabled to access claim endpoints.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountNotEnabled:
              value:
                error: claimant account is not enabled
    '404':
      description: Claim does not exist, is not owned by the authenticated user, or the image is not linked and available for that claim.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            claimNotFound:
              value:
                error: claim resource not found
    '500':
      description: Unexpected error while resolving the evidence image.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                error: internal server error
