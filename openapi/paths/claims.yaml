get:
  tags:
  - Claims
  operationId: listMyClaims
  summary: List my claims
  description: Returns only claims owned by the authenticated user. Items are ordered by creation time descending, then claim ID descending. Testimony, evidence contents, and administrative actions are not included.
  security:
  - BearerAuth: []
  parameters:
  - name: status
    in: query
    required: false
    description: Filter by claim status. Omit to include all statuses.
    schema:
      type: string
      enum:
      - open
      - in_review
      - resolved
      - dismissed
  - name: page
    in: query
    required: false
    description: 1-based page number.
    schema:
      type: integer
      format: int32
      minimum: 1
      default: 1
  - name: limit
    in: query
    required: false
    description: Number of items per page.
    schema:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 20
  responses:
    '200':
      description: Owned claims page. An empty result is returned as an empty items array.
      headers:
        Cache-Control:
          description: Private response that must not be stored.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaimListPage'
    '400':
      description: Invalid status, repeated or unknown query parameter, or invalid pagination value.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCriteria:
              value:
                error: invalid claim list criteria
    '401':
      description: Authentication failed or authenticated user could not be obtained.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The authenticated account is not enabled to access claim endpoints.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountNotEnabled:
              value:
                error: claimant account is not enabled
    '500':
      description: Unexpected error while listing claims.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                error: internal server error
post:
  tags:
  - Claims
  operationId: submitClaim
  summary: Submit a claim
  description: Creates a claim for an operation in which the authenticated consumer or provider participates. The claimant is derived from authentication. Evidence images must already be uploaded and confirmed using the file endpoints. Replaying the same key and normalized request returns the same claim in its current state; the replay does not create another claim.
  security:
  - BearerAuth: []
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: Non-zero UUID identifying this submission for the authenticated claimant. Reuse only when retrying the same request.
    schema:
      type: string
      format: uuid
    example: 5e1ad84e-190c-46ee-8da5-4e88fb64ba87
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ClaimSubmissionRequest'
        examples:
          jobRequestClaim:
            summary: Claim for an operation identified by a job request
            value:
              reference:
                job_request_id: 12
              reason: non_compliance
              description: El servicio acordado no fue completado.
              image_file_ids: []
  responses:
    '201':
      description: Claim created. The initial status is open.
      headers:
        Location:
          description: Relative path of the newly created claim.
          schema:
            type: string
            example: /claims/7
        Cache-Control:
          description: Private response that must not be stored.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaimAcknowledgment'
    '200':
      description: Idempotent replay of a previously confirmed submission. Returns that claim's current status and original creation time; no Location header is set.
      headers:
        Cache-Control:
          description: Private response that must not be stored.
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaimAcknowledgment'
    '400':
      description: Invalid body, reference, reason, testimony, evidence list, or idempotency key.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidSubmission:
              value:
                error: invalid claim submission
            invalidIdempotencyKey:
              value:
                error: invalid claim idempotency key
            invalidEvidence:
              value:
                error: invalid claim evidence
    '401':
      description: Authentication failed or authenticated user could not be obtained.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The authenticated account is not enabled to submit claims.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountNotEnabled:
              value:
                error: claimant account is not enabled
    '404':
      description: The referenced resource does not exist or is not accessible to the authenticated participant.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '409':
      description: The key was already used with different content, or this claimant already has an unfinished claim for the same operation.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotencyKeyConflict:
              summary: Key reused with different content
              value:
                error: claim submission key already used with different content
            unfinishedClaimConflict:
              summary: An unfinished claim already exists for this claimant and operation
              value:
                error: an unfinished claim already exists for this operation
    '500':
      description: Unexpected error while submitting the claim.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                error: internal server error
