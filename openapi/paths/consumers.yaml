post:
  tags:
  - Consumers
  operationId: registerConsumer
  summary: Register the authenticated user as a consumer
  description: Creates a consumer account for the authenticated Auth0 subject. The
    Auth0 subject is taken from the Bearer JWT and persisted as the user's auth identifier.
    The backend validates and resolves the required service address before persisting the
    user, consumer profile, coordinates, and internal coverage-zone association atomically.
  security:
  - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RegisterConsumerRequest'
        examples:
          validConsumer:
            summary: Valid consumer registration with an optional profile photo
            value:
              email: ana@example.com
              name: Ana Perez
              surname: Mamani Tipula
              address:
                street: Av. Rivadavia
                street_number: '5100'
                floor: '4'
                unit: B
              profile_photo_file_id: 4af47f1b-97b6-4b32-baa0-b95d6077f919
  responses:
    '201':
      description: Consumer account registered successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsumerSummary'
          examples:
            registered:
              value:
                id: 42
                name: Ana Perez
                surname: Mamani Tipula
                profile_photo_url: https://cdn.example/files/2026/07/profile_photo/4af47f1b-97b6-4b32-baa0-b95d6077f919.jpg
    '400':
      description: The request body is not valid JSON, lacks a required address field,
        contains an invalid address or email, or references an unavailable profile photo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidEmail:
              summary: Invalid email format
              value:
                error: Invalid email format
            invalidJson:
              summary: Invalid JSON body
              value:
                error: invalid character '}' looking for beginning of object key string
            unavailableProfilePhoto:
              summary: Missing, unconfirmed, foreign, or invalid-purpose profile photo
              value:
                error: Profile photo could not be uploaded
    '401':
      description: Authentication failed or the authenticated user id could not be
        obtained from the request context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            invalidToken:
              summary: Missing or invalid Bearer token
              value:
                error: invalid_token
                message: Failed to validate JWT.
            missingClaims:
              summary: JWT claims not available after validation
              value:
                error: missing claims
            missingUserId:
              summary: Subject claim is missing or empty
              value:
                error: missing user id
    '409':
      description: A user with the same email already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            emailAlreadyRegistered:
              value:
                error: Email is already registered
    '503':
      description: The location service is temporarily unavailable and the registration was not persisted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
