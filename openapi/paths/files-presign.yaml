post:
  tags:
  - Files
  operationId: presignFileUpload
  summary: Request a file upload URL
  description: Creates a pending file record and returns a direct upload URL. Conversation audio must be WebM with Opus, no larger than 5 MiB and 300 seconds. Conversation video must be MP4 with H.264 and optional AAC audio, no larger than 50 MiB; the server validates the object contents, codecs, dimensions, and duration during confirmation, up to 120 seconds.
  security:
  - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PresignFileRequest'
  responses:
    '200':
      description: Upload URL generated successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PresignFileResponse'
    '400':
      description: Invalid file request, unsupported format, or file too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidProfilePhoto:
              value:
                error: Profile photo could not be uploaded
    '401':
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '500':
      description: Unexpected error while preparing the upload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
