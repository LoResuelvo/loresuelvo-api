post:
  tags:
    - IdentityVerification
  operationId: processIdentityVerificationWebhook
  summary: Process a Didit identity-verification status update
  description: >-
    Receives an authenticated `status.updated` notification from Didit. This
    public endpoint uses the Didit signature headers and does not accept Auth0
    credentials. The unique `event_id` makes retries idempotent: a repeated
    event is acknowledged without applying it again. Authenticated events whose
    `created_at` precedes the latest accepted result are recorded and
    acknowledged without changing the current verification state. Processing
    the event identity and session state is atomic. Only the event identifier,
    session identifier, and occurrence/receipt timestamps are retained for this
    purpose; the complete webhook payload is not persisted.
  security: []
  parameters:
    - name: X-Signature-V2
      in: header
      required: true
      description: HMAC-SHA256 signature of the canonical JSON request body.
      schema:
        type: string
    - name: X-Timestamp
      in: header
      required: true
      description: Unix timestamp used to limit replay to five minutes.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: Didit status.updated envelope. The payload is validated against the persisted session before it reaches the domain.
          additionalProperties: true
  responses:
    '204':
      description: Notification accepted. New current results are applied; duplicate or older results are acknowledged without changing the current state.
    '400':
      description: Invalid JSON or webhook contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401':
      description: Invalid HMAC signature or stale timestamp.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '503':
      description: The local verification session is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
