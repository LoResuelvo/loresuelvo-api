get:
  tags:
  - JobRequests
  operationId: listPendingJobRequests
  summary: List pending job requests
  description: Returns pending job requests where the authenticated user participates as consumer or provider. The authenticated JWT subject is matched against the user auth id; job request records keep internal consumer and provider identifiers.
  security:
  - BearerAuth: []
  responses:
    '200':
      description: Pending job requests for the authenticated user. The array is empty when there are no pending requests.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobRequestSummary'
          examples:
            withRequests:
              value:
              - id: 1
                conversation_id: 10
                title: Reparación de fuga en la cocina
                description: Hola Ana, necesito reparar una fuga de agua en la cocina. ¿Podrías ayudarme esta semana?
                status: pending
                requester:
                  name: Ana
                  surname: Pérez
                images:
                - id: 4af47f1b-97b6-4b32-baa0-b95d6077f919
                  url: https://cdn.example/private/job-request-image.jpg?signature=temporary
                  original_name: perdida-bajo-mesada.jpg
            empty:
              value: []
    '401':
      description: Authentication failed or the authenticated user id could not be obtained from the request context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '500':
      description: Unexpected error while listing job requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
post:
  tags:
  - JobRequests
  operationId: createJobRequest
  summary: Create a job request
  description: >-
    Creates a job request from the authenticated consumer to a provider and
    links it to a pending conversation. The provider's current category must be
    enabled when the request is persisted; disabling a category does not cancel
    requests and negotiations that already exist. After the job request and
    conversation are committed, the API persists a `job_request_received`
    notification for the assigned provider and attempts delivery through the
    existing realtime and phone-notice channels.
  security:
  - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateJobRequestRequest'
        examples:
          validRequest:
            summary: Valid job request
            value:
              provider_id: 1
              title: Reparación de fuga en la cocina
              description: Hola Ana, necesito reparar una fuga de agua en la cocina. ¿Podrías ayudarme esta semana?
              image_file_ids:
              - 4af47f1b-97b6-4b32-baa0-b95d6077f919
  responses:
    '201':
      description: Job request created successfully.
      headers:
        Location:
          description: Path of the created job request resource.
          schema:
            type: string
            example: /job-requests/1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobRequest'
          examples:
            created:
              value:
                id: 1
                conversation_id: 10
                title: Reparación de fuga en la cocina
                description: Hola Ana, necesito reparar una fuga de agua en la cocina. ¿Podrías ayudarme esta semana?
                status: pending
                images:
                - id: 4af47f1b-97b6-4b32-baa0-b95d6077f919
                  url: https://cdn.example/private/job-request-image.jpg?signature=temporary
                  original_name: perdida-bajo-mesada.jpg
    '400':
      description: The request body is invalid, provider_id is missing or zero, title is empty after trimming, or the attached images are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            titleRequired:
              value:
                error: Title is required
            providerRequired:
              value:
                error: Provider id is required
    '401':
      description: Authentication failed or the authenticated user id could not be obtained from the request context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The authenticated user is not a consumer and cannot create a job request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            onlyConsumer:
              value:
                error: Only consumers can create job requests
    '404':
      description: No provider exists with the requested id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            providerNotFound:
              value:
                error: Provider does not exist
    '409':
      description: >-
        A job request or conversation between this consumer and provider already
        exists, or the provider's category is disabled and cannot accept a new
        request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            alreadyExists:
              summary: A request or conversation already exists
              value:
                error: Job request already exists
            categoryDisabled:
              summary: The provider's category is disabled
              value:
                error: Category is disabled
    '500':
      description: >-
        Unexpected error while creating the job request. Notification persistence
        or realtime dispatch may fail after the job request and conversation have
        already committed, so this response does not imply they were rolled back.
        Phone-notice delivery is best-effort and does not roll back the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
