                    percentage: null
    '400':
      description: Incomplete or invalid interval, malformed timestamp/query, unsupported parameter, empty
        or repeated parameter.
      headers:
        Cache-Control:
          description: Prevents storage of private conversion statistics, including error responses.
          schema:
            type: string
            const: private, no-store
        X-Request-ID:
          description: Request correlation identifier.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid conversion query
    '401':
      description: The Bearer token is missing or invalid; defensive missing-identity errors also return
        401.
      headers:
        Cache-Control:
          description: Prevents storage of private conversion statistics, including error responses.
          schema:
            type: string
            const: private, no-store
        X-Request-ID:
          description: Request correlation identifier.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          example:
            error: invalid_token
            message: Failed to validate JWT.
    '403':
      description: The registered authenticated user has a non-provider role, such as consumer.
      headers:
        Cache-Control:
          description: Prevents storage of private conversion statistics, including error responses.
          schema:
            type: string
            const: private, no-store
        X-Request-ID:
          description: Request correlation identifier.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: provider access required
    '404':
      description: No user exists for the authenticated identity, or its provider profile is missing.
      headers:
        Cache-Control:
          description: Prevents storage of private conversion statistics, including error responses.
          schema:
            type: string
            const: private, no-store
        X-Request-ID:
          description: Request correlation identifier.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: provider not found
    '500':
      description: The complete conversion snapshot could not be read or calculated; partial or empty
        statistics are not substituted.
      headers:
        Cache-Control:
          description: Prevents storage of private conversion statistics, including error responses.
          schema:
            type: string
            const: private, no-store
        X-Request-ID:
          description: Request correlation identifier.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
