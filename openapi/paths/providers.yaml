get:
  tags:
  - Providers
  operationId: filterProvidersByCategory
  summary: Filter providers by category
  description: Returns providers whose registered category matches the category_id
    query parameter selected by the frontend from GET /categories.
  security:
  - BearerAuth: []
  parameters:
  - name: category_id
    in: query
    required: true
    description: Existing category identifier selected from GET /categories.
    schema:
      type: integer
      format: int32
      example: 1
  responses:
    '200':
      description: Providers matching the requested category. The array is empty when
        the category exists but has no registered providers.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProviderSearchResult'
          examples:
            providersFound:
              value:
              - id: 1
                name: Juan
                surname: Pérez
                category_name: Plomería
                profile_photo_url: https://cdn.example/files/2026/06/profile_photo/juan.jpg
                rating_average: 4.5
                rating_count: 2
              - id: 2
                name: Pedro
                surname: Dib
                category_name: Plomería
                profile_photo_url: https://cdn.example/files/2026/06/profile_photo/pedro.jpg
                rating_average: 0
                rating_count: 0
            noProviders:
              value: []
    '400':
      description: The category_id query parameter is missing, invalid, zero or negative.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            categoryRequired:
              value:
                error: Category id is required
    '401':
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            invalidToken:
              value:
                error: invalid_token
                message: Failed to validate JWT.
    '404':
      description: No category exists with the requested id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            categoryNotFound:
              value:
                error: Category does not exist
    '500':
      description: Unexpected error while searching providers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

post:
  tags:
  - Providers
  operationId: registerProvider
  summary: Register the authenticated user as a provider
  description: Creates a provider account for the authenticated Auth0 subject. The
    Auth0 subject is taken from the Bearer JWT and persisted as the user auth identifier.
    The current implementation consumes email, name, surname, category_id, and a confirmed profile_photo_file_id; coverage_zone
    is accepted by JSON binding but is not passed to the provider service or persisted.
  security:
  - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RegisterProviderRequest'
        examples:
          validProvider:
            summary: Valid provider registration
            value:
              email: prestador@example.com
              name: Juan
              surname: Pérez
              category_id: 1
              profile_photo_file_id: 4af47f1b-97b6-4b32-baa0-b95d6077f919
              coverage_zone:
              - Zona Norte
  responses:
    '201':
      description: Provider account registered successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderSummary'
          examples:
            registered:
              value:
                id: 1
                name: Juan
                surname: Pérez
                category_name: Plomería
                profile_photo_url: https://cdn.example/files/2026/06/profile_photo/juan.jpg
    '400':
      description: The request body is not valid JSON, cannot be bound to the expected
        payload, contains an invalid email format, omits category_id, or references
        a category that does not exist, omits a profile photo, or references a profile photo that cannot be used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidEmail:
              summary: Invalid email format
              value:
                error: Invalid email format
            invalidJson:
              summary: Invalid JSON body
              value:
                error: invalid character '}' looking for beginning of object key string
            categoryRequired:
              summary: Missing or zero category id
              value:
                error: Category id is required
            categoryNotFound:
              summary: Category id does not exist
              value:
                error: Category does not exist
            profilePhotoRequired:
              summary: Profile photo missing
              value:
                error: Profile photo is required
            profilePhotoUnavailable:
              summary: Profile photo cannot be used
              value:
                error: Profile photo could not be uploaded
    '401':
      description: Authentication failed or the authenticated user id could not be
        obtained from the request context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            invalidToken:
              summary: Missing or invalid Bearer token
              value:
                error: invalid_token
                message: Failed to validate JWT.
            missingClaims:
              summary: JWT claims not available after validation
              value:
                error: missing claims
            missingUserId:
              summary: Subject claim is missing or empty
              value:
                error: missing user id
    '409':
      description: A user with the same email already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            emailAlreadyRegistered:
              value:
                error: Email is already registered
