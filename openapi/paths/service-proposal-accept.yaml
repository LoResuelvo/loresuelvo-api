post:
  tags:
    - ServiceProposals
  operationId: acceptServiceProposal
  summary: Accept a service proposal
  description: |
    Accepts a pending service proposal and atomically creates its scheduled work order.
    The API then stores an acceptance notification for the provider and publishes it
    through the realtime WebSocket channel when the provider is connected.
  security:
    - BearerAuth: []
  parameters:
    - name: serviceProposalId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    '201':
      description: Service proposal accepted and work order created.
      headers:
        Location:
          description: URI of the created work order.
          schema:
            type: string
            example: /work-orders/42
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkOrder'
    '400':
      description: The service proposal identifier is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401':
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The authenticated user is not the proposal's recipient consumer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '404':
      description: The service proposal does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '409':
      description: The service proposal is not pending or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      description: The service proposal could not be accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
