get:
  summary: List the authenticated user's service proposals
  tags:
    - ServiceProposals
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Service proposals involving the authenticated user
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ServiceProposalSummary'
    '401':
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '500':
      description: Service proposals could not be retrieved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
post:
  tags:
    - ServiceProposals
  operationId: createServiceProposal
  summary: Create a service proposal
  description: |
    Creates a pending service proposal from the authenticated provider to a consumer.
    The provider and consumer must already have an active work conversation.
    The provider must also have completed the payment-account connection required
    by LoResuelvo before sending proposals.

    After the proposal is persisted, the API stores a notification for the consumer
    and publishes it through the realtime WebSocket channel when the consumer is connected.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateServiceProposalRequest'
        examples:
          validProposal:
            summary: Valid service proposal
            value:
              consumer_id: 1
              amount: '15000.50'
              scheduled_on: '2026-07-05T12:30:00Z'
              description: Reparación de pérdida de agua en cocina con materiales incluidos.
  responses:
    '201':
      description: Service proposal created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceProposal'
          examples:
            created:
              value:
                id: 10
                conversation_id: 25
                consumer_id: 1
                provider_id: 2
                amount_cents: 1500050
                scheduled_on: '2026-07-05T12:30:00Z'
                description: Reparación de pérdida de agua en cocina con materiales incluidos.
                status: pending
                booking_terms:
                  currency: ARS
                  service_total_cents: 1500050
                  deposit_cents: 300010
                  remaining_service_balance_cents: 1200040
                  platform_fee_total_cents: 500000
                  platform_fee_due_now_cents: 100000
                  remaining_platform_fee_cents: 400000
                  amount_due_now_cents: 400010
                  remaining_amount_due_cents: 1600040
                  contract_total_cents: 2000050
                  booking_payment_deadline: '2026-07-04T12:30:00Z'
    '400':
      description: The request body is invalid, required fields are missing, the amount is invalid, or scheduled_on does not leave more than 24 hours of booking lead time.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidAmount:
              value:
                error: Amount must be greater than zero
            invalidScheduledOn:
              value:
                error: Scheduled on must be in the future
            insufficientBookingLeadTime:
              value:
                error: Scheduled on must be more than 24 hours in the future
    '401':
      description: Authentication failed or the authenticated user id could not be obtained from the request context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The authenticated user is not a provider and cannot create a service proposal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            onlyProvider:
              value:
                error: Provider is required
    '404':
      description: No consumer exists with the requested id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            consumerNotFound:
              value:
                error: Consumer is required
    '409':
      description: The provider and consumer do not have an active work conversation, or the provider has not completed the required payment-account connection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            activeConversationRequired:
              value:
                error: Provider and consumer must have an active conversation before creating a service proposal
            paymentAccountRequired:
              value:
                error: A connected payment account is required before creating a service proposal
    '500':
      description: Unexpected error while creating the service proposal or storing its notification.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
