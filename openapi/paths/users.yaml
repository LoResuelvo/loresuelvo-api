get:
  tags:
  - Users
  operationId: getCurrentUser
  summary: Get the authenticated user
  description: Returns the complete consumer or provider profile associated with the
    Auth0 subject contained in the Bearer JWT. The role property discriminates the
    concrete response schema.
  security:
  - BearerAuth: []
  responses:
    '200':
      description: Authenticated user found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUserResponse'
          examples:
            consumer:
              summary: Consumer user
              value:
                id: 10
                name: Ana
                surname: Pérez
                email: ana@example.com
                role: consumer
                calendar_connection_status: disconnected
                profile_photo:
                  original_name: foto-perfil.jpg
                  url: https://cdn.example/profile/foto-perfil.jpg
            provider:
              summary: Provider user
              value:
                id: 20
                name: Juan
                surname: Gómez
                email: juan@example.com
                role: provider
                calendar_connection_status: connected
                profile_photo:
                  original_name: foto-perfil.jpg
                  url: https://cdn.example/profile/foto-perfil.jpg
                category:
                  id: 1
                  name: Plomería
    '401':
      description: Authentication failed or the authenticated user id could not be
        obtained from the request context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            invalidToken:
              summary: Missing or invalid Bearer token
              value:
                error: invalid_token
                message: Failed to validate JWT.
            missingClaims:
              summary: JWT claims not available after validation
              value:
                error: missing claims
            missingUserId:
              summary: Subject claim is missing or empty
              value:
                error: missing user id
    '404':
      description: No persisted user exists for the authenticated Auth0 subject.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userNotFound:
              value:
                error: User was not found
    '500':
      description: The user profile could not be prepared, for example because the
        profile photo URL could not be resolved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
