get:
  tags:
    - WorkOrders
  operationId: getWorkOrderConfirmationCode
  summary: Get the fully paid work order confirmation code
  description: |
    Returns the four-digit confirmation code only to the consumer who owns the
    work order and only after Mercado Pago has verified the full service-balance
    payment. This operation does not confirm that the service was performed.
  security:
    - BearerAuth: []
  parameters:
    - name: workOrderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    '200':
      description: Confirmation code available to the work order consumer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkOrderConfirmationCode'
    '400':
      description: The work order identifier is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401':
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '403':
      description: The authenticated user is not the work order's consumer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '404':
      description: The work order does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '409':
      description: The full service-balance payment has not been approved and verified yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      description: The confirmation code could not be retrieved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
