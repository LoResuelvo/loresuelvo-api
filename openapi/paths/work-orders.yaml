get:
  summary: List the authenticated user's work orders
  tags:
    - WorkOrders
  description: >-
    Lists persisted work orders involving the authenticated user, ordered by
    scheduled service date ascending. A provider's `counterpart.category_name`
    reflects the provider's current category assignment, not a category-name
    snapshot taken when the order was created. Disabling that category does not
    remove the category name or the existing work order from the participants'
    list.
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Work orders involving the authenticated user. The array is empty when there are no work orders.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkOrderSummary'
          examples:
            withOrders:
              value:
                - id: 42
                  service_proposal_id: 10
                  amount_cents: 1500050
                  scheduled_on: '2026-07-05T12:30:00Z'
                  description: Reparación de pérdida de agua en cocina con materiales incluidos.
                  status: scheduled
                  accepted_on: '2026-07-04T13:00:00Z'
                  counterpart:
                    id: 2
                    role: provider
                    name: Juan
                    surname: Gómez
                    category_name: Plomería
                    profile_photo_url: https://cdn.example/public/profile-photo.jpg
            empty:
              value: []
    '401':
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    '500':
      description: Work orders could not be retrieved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
